<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadena de Señal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#07080f;
  --panel:#0d1117;
  --panel2:#111827;
  --border:#1e2d40;
  --border2:#243447;
  --text:#d4e8f0;
  --text2:#607a90;
  --text3:#3a5268;
  --blue:#2196f3;
  --blue2:#1565c0;
  --yellow:#ffc107;
  --yellow2:#ff8f00;
  --red:#f44336;
  --red2:#b71c1c;
  --green:#00e676;
  --green2:#00c853;
  --cyan:#00e5ff;
  --orange:#ff6d00;
  --orb:'Orbitron',monospace;
  --raj:'Rajdhani',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:var(--raj);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* grid bg */
body::before{
  content:'';position:fixed;top:0;left:0;right:0;bottom:0;
  background-image:linear-gradient(rgba(33,150,243,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(33,150,243,0.03) 1px,transparent 1px);
  background-size:40px 40px;pointer-events:none;z-index:0;
}

.page{max-width:960px;margin:0 auto;padding:16px 14px 60px;position:relative;z-index:1;}

/* HEADER */
header{text-align:center;padding:20px 0 16px;border-bottom:1px solid var(--border);margin-bottom:18px;position:relative;}
header::after{content:'';position:absolute;bottom:-1px;left:20%;right:20%;height:2px;
  background:linear-gradient(90deg,transparent,var(--blue),var(--cyan),var(--blue),transparent);}
.htag{font-family:var(--orb);font-size:9px;letter-spacing:5px;color:var(--blue);margin-bottom:8px;opacity:0.8;}
h1{font-family:var(--orb);font-weight:900;font-size:clamp(18px,4vw,30px);
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:2px;margin-bottom:4px;}
.hsub{font-family:var(--raj);font-size:13px;color:var(--text2);letter-spacing:1px;}

/* SCORE */
.score-bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;}
.schip{background:var(--panel);border:1px solid var(--border);border-radius:3px;
  padding:6px 14px;display:flex;align-items:center;gap:8px;font-family:var(--orb);font-size:11px;}
.schip .val{color:var(--cyan);font-weight:700;}
.schip .lbl{color:var(--text3);font-size:9px;letter-spacing:2px;}

/* PHASE TABS */
.phase-bar{display:flex;gap:0;margin-bottom:18px;border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.phase-step{flex:1;padding:10px 6px;text-align:center;background:var(--panel);
  border-right:1px solid var(--border);cursor:pointer;transition:all 0.2s;
  font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text3);font-family:var(--orb);}
.phase-step:last-child{border-right:none;}
.phase-step:hover{color:var(--text2);background:var(--panel2);}
.phase-step.active{background:rgba(33,150,243,0.12);color:var(--blue);border-bottom:2px solid var(--blue);}
.phase-step.done{background:rgba(0,230,118,0.08);color:var(--green2);}

/* CHAIN DIAGRAM */
.chain-diagram{
  display:flex;align-items:center;gap:0;margin-bottom:18px;
  background:var(--panel);border:1px solid var(--border);border-radius:4px;
  padding:12px 16px;overflow:hidden;
}
.chain-block{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 6px;border-radius:4px;transition:all 0.3s;cursor:pointer;
  border:1px solid transparent;
}
.chain-block:hover{border-color:var(--border2);}
.chain-block.active-block{border-color:var(--blue);background:rgba(33,150,243,0.08);}
.chain-block.done-block{border-color:var(--green2);background:rgba(0,230,118,0.05);}
.chain-icon{font-size:24px;}
.chain-label{font-family:var(--orb);font-size:8px;letter-spacing:2px;color:var(--text2);text-align:center;}
.chain-label.blue{color:var(--blue);}
.chain-label.yellow{color:var(--yellow);}
.chain-label.red{color:var(--red);}
.chain-label.done{color:var(--green);}
.chain-arrow{
  flex-shrink:0;width:40px;display:flex;align-items:center;justify-content:center;
  position:relative;
}
.arrow-line{height:2px;background:var(--border2);width:100%;position:relative;transition:all 0.5s;}
.arrow-line.active-arrow{background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 8px var(--blue);}
.arrow-line.done-arrow{background:linear-gradient(90deg,var(--green),var(--green2));box-shadow:0 0 6px var(--green);}
.arrow-head{position:absolute;right:-2px;top:-4px;
  border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid var(--border2);}
.arrow-line.active-arrow .arrow-head{border-left-color:var(--cyan);}
.arrow-line.done-arrow .arrow-head{border-left-color:var(--green);}
/* signal particle */
.sig-particle{
  position:absolute;width:8px;height:8px;border-radius:50%;
  background:var(--cyan);box-shadow:0 0 8px var(--cyan);
  top:-3px;left:0;animation:none;
}
.sig-particle.running{animation:travelArrow 0.8s linear infinite;}
@keyframes travelArrow{from{left:0}to{left:calc(100% - 8px)}}

/* CANVAS DISPLAY */
.canvas-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.canvas-box{flex:1;min-width:200px;background:#030508;border:1px solid var(--border2);border-radius:4px;
  position:relative;overflow:hidden;}
.canvas-box canvas{display:block;width:100%;}
.canvas-tag{position:absolute;top:6px;left:8px;font-family:var(--orb);font-size:8px;
  letter-spacing:2px;color:var(--text3);}
.canvas-tag.blue{color:var(--blue);}
.canvas-tag.yellow{color:var(--yellow);}
.canvas-tag.red{color:var(--red);}
.canvas-tag.green{color:var(--green);}
.canvas-tag.out{right:8px;left:auto;}

/* CARDS */
.lab-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:14px;}
.lab-head{background:var(--panel2);padding:12px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;}
.phase-tag{font-family:var(--orb);font-size:8px;letter-spacing:3px;padding:4px 10px;border-radius:2px;font-weight:700;}
.tag-blue{background:rgba(33,150,243,0.15);color:var(--blue);border:1px solid rgba(33,150,243,0.3);}
.tag-yellow{background:rgba(255,193,7,0.15);color:var(--yellow);border:1px solid rgba(255,193,7,0.3);}
.tag-red{background:rgba(244,67,54,0.15);color:var(--red);border:1px solid rgba(244,67,54,0.3);}
.lab-head h2{font-size:15px;font-weight:700;color:var(--text);font-family:var(--raj);letter-spacing:1px;}
.lab-body{padding:18px;}

/* CONTROLS */
.ctrl-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.ctrl-group{flex:1;min-width:160px;}
.ctrl-label{font-family:var(--orb);font-size:9px;color:var(--text2);margin-bottom:7px;
  display:flex;justify-content:space-between;letter-spacing:1px;}
.ctrl-label span{font-size:12px;font-weight:700;}
.ctrl-label span.blue{color:var(--blue);}
.ctrl-label span.yellow{color:var(--yellow);}
.ctrl-label span.red{color:var(--red);}

input[type=range]{width:100%;-webkit-appearance:none;appearance:none;
  height:4px;border-radius:2px;outline:none;cursor:pointer;}
input[type=range].blue-range{
  background:linear-gradient(90deg,var(--blue) var(--pct,50%),var(--border2) var(--pct,50%));}
input[type=range].blue-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--blue);border:2px solid var(--bg);box-shadow:0 0 8px rgba(33,150,243,0.7);}
input[type=range].yellow-range{
  background:linear-gradient(90deg,var(--yellow) var(--pct,50%),var(--border2) var(--pct,50%));}
input[type=range].yellow-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--yellow);border:2px solid var(--bg);box-shadow:0 0 8px rgba(255,193,7,0.7);}
input[type=range].red-range{
  background:linear-gradient(90deg,var(--red) var(--pct,50%),var(--border2) var(--pct,50%));}
input[type=range].red-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--red);border:2px solid var(--bg);box-shadow:0 0 8px rgba(244,67,54,0.7);}

/* WAVE TYPE BUTTONS */
.wave-btns{display:flex;gap:8px;margin-bottom:14px;}
.wave-btn{flex:1;background:var(--panel2);border:2px solid var(--border2);
  border-radius:4px;padding:10px 8px;cursor:pointer;transition:all 0.18s;
  font-family:var(--orb);font-size:9px;letter-spacing:1px;color:var(--text2);
  display:flex;flex-direction:column;align-items:center;gap:5px;}
.wave-btn:hover{border-color:var(--blue);color:var(--blue);}
.wave-btn.selected{background:rgba(33,150,243,0.12);border-color:var(--blue);color:var(--cyan);}
.wave-btn svg{width:60px;height:24px;}

/* TRANSISTOR STATES */
.trt-states{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.trt-state{flex:1;min-width:140px;background:var(--panel2);border:1px solid var(--border2);
  border-radius:4px;padding:10px 12px;text-align:center;transition:all 0.3s;}
.trt-state.active-state{border-color:var(--yellow);background:rgba(255,193,7,0.08);}
.trt-state-icon{font-size:22px;margin-bottom:4px;}
.trt-state-label{font-family:var(--orb);font-size:8px;letter-spacing:2px;
  color:var(--text2);margin-bottom:2px;}
.trt-state-label.open{color:var(--red);}
.trt-state-label.partial{color:var(--yellow);}
.trt-state-label.closed{color:var(--green);}
.trt-state-desc{font-size:11px;color:var(--text3);}

/* TRANSISTOR DIAGRAM */
.trt-diagram{
  background:#030508;border:1px solid var(--border2);border-radius:4px;
  padding:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:20px;
}
.trt-terminal{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--orb);font-size:9px;}
.trt-dot{width:14px;height:14px;border-radius:50%;border:2px solid;transition:all 0.3s;}
.trt-dot.B{border-color:var(--yellow);background:transparent;}
.trt-dot.B.on{background:var(--yellow);box-shadow:0 0 12px var(--yellow);}
.trt-dot.C{border-color:var(--blue);background:transparent;}
.trt-dot.C.on{background:var(--blue);box-shadow:0 0 12px var(--blue);}
.trt-dot.E{border-color:var(--green);background:transparent;}
.trt-dot.E.on{background:var(--green);box-shadow:0 0 12px var(--green);}
.trt-body{
  width:60px;height:60px;border-radius:50%;
  border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--orb);font-size:10px;color:var(--text3);
  transition:all 0.3s;background:#030508;
}
.trt-body.conducting{border-color:var(--yellow);color:var(--yellow);box-shadow:0 0 16px rgba(255,193,7,0.3);}
.trt-wire{width:30px;height:2px;background:var(--border2);transition:all 0.3s;}
.trt-wire.active{background:var(--yellow);box-shadow:0 0 6px var(--yellow);}
.trt-wire.signal{background:var(--green);box-shadow:0 0 6px var(--green);}

/* GAIN DISPLAY */
.gain-display{
  display:flex;gap:12px;align-items:center;
  background:#030508;border:1px solid var(--border2);border-radius:4px;
  padding:12px 16px;margin-bottom:14px;flex-wrap:wrap;
}
.gain-val{
  font-family:var(--orb);font-size:32px;color:var(--red);
  text-shadow:0 0 20px rgba(244,67,54,0.5);min-width:70px;text-align:center;
}
.gain-info{flex:1;}
.gain-info-title{font-family:var(--orb);font-size:9px;color:var(--text3);letter-spacing:2px;margin-bottom:4px;}
.gain-formula{font-family:var(--orb);font-size:13px;color:var(--text2);}
.gain-formula span{color:var(--red);}

/* QUIZ */
.quiz-box{background:#030508;border:1px solid var(--border2);border-radius:4px;
  padding:16px;margin-bottom:14px;}
.quiz-q{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;line-height:1.5;
  letter-spacing:0.5px;}
.quiz-opts{display:flex;gap:8px;flex-wrap:wrap;}
.quiz-opt{flex:1;min-width:120px;background:var(--panel2);border:2px solid var(--border2);
  border-radius:4px;padding:11px 12px;font-family:var(--raj);font-size:13px;font-weight:600;
  color:var(--text2);cursor:pointer;transition:all 0.16s;text-align:center;}
.quiz-opt:hover:not(:disabled){border-color:var(--blue);color:var(--text);}
.quiz-opt:disabled{cursor:default;}
.quiz-opt.correct{background:rgba(0,230,118,0.1);border-color:var(--green);color:var(--green);}
.quiz-opt.wrong{background:rgba(244,67,54,0.08);border-color:var(--red);color:var(--red);opacity:0.5;text-decoration:line-through;}

/* FEEDBACK */
.feedback-box{border-radius:4px;padding:11px 14px;margin-top:10px;
  font-size:13px;font-weight:600;line-height:1.6;display:none;animation:fadeUp 0.3s ease;
  font-family:var(--raj);}
.feedback-box.show{display:block;}
.feedback-box.ok{background:rgba(0,230,118,0.09);border:1px solid var(--green2);color:var(--green);}
.feedback-box.hint{background:rgba(255,193,7,0.07);border:1px solid rgba(255,193,7,0.3);color:var(--yellow);}

/* NEXT BTN */
.next-btn{display:none;margin-top:14px;
  background:linear-gradient(135deg,rgba(33,150,243,0.15),rgba(33,150,243,0.05));
  border:1px solid var(--blue);color:var(--blue);border-radius:4px;padding:12px 24px;
  font-family:var(--orb);font-size:11px;font-weight:700;cursor:pointer;transition:all 0.18s;
  width:100%;letter-spacing:2px;}
.next-btn.show{display:block;}
.next-btn:hover{background:rgba(33,150,243,0.2);}

/* INFO BOX */
.info-box{background:rgba(33,150,243,0.05);border:1px solid rgba(33,150,243,0.2);
  border-radius:4px;padding:12px 14px;margin-bottom:14px;
  font-size:12px;color:var(--text2);line-height:1.7;font-family:var(--raj);}
.info-box strong{color:var(--cyan);}

/* RESULTS */
.results-card{background:var(--panel);border:1px solid var(--blue);border-radius:8px;
  padding:32px 24px;text-align:center;display:none;animation:fadeUp 0.4s ease;
  box-shadow:0 0 40px rgba(33,150,243,0.12);}
.results-card.show{display:block;}
.res-emoji{font-size:60px;display:block;margin-bottom:14px;}
.res-title{font-family:var(--orb);font-weight:900;font-size:clamp(16px,3.5vw,26px);
  color:var(--cyan);margin-bottom:6px;letter-spacing:2px;}
.res-score{font-family:var(--orb);font-size:clamp(36px,7vw,52px);
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin:8px 0;}
.res-sub{font-size:14px;color:var(--text2);margin-bottom:20px;font-family:var(--raj);}
.res-stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:22px;}
.rstat{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:12px 18px;}
.rstat-v{font-family:var(--orb);font-size:22px;color:var(--cyan);}
.rstat-l{font-size:10px;color:var(--text3);font-family:var(--orb);margin-top:2px;letter-spacing:1px;}
.restart-btn{background:var(--blue);color:var(--bg);border:none;border-radius:4px;
  padding:13px 32px;font-family:var(--orb);font-size:12px;font-weight:700;
  cursor:pointer;transition:all 0.18s;letter-spacing:2px;}
.restart-btn:hover{filter:brightness(1.15);transform:translateY(-1px);}

/* CHAIN SUMMARY (final) */
.chain-summary{display:flex;gap:0;margin-bottom:20px;overflow:hidden;border-radius:4px;border:1px solid var(--border);}
.chain-sum-block{flex:1;padding:14px 10px;text-align:center;border-right:1px solid var(--border);}
.chain-sum-block:last-child{border-right:none;}
.csb-icon{font-size:28px;margin-bottom:6px;}
.csb-label{font-family:var(--orb);font-size:8px;letter-spacing:2px;color:var(--text3);margin-bottom:4px;}
.csb-value{font-family:var(--raj);font-size:13px;font-weight:700;color:var(--text);}

/* PTS */
.pts-pop{position:fixed;font-family:var(--orb);font-size:22px;pointer-events:none;z-index:9999;animation:popUp 1.1s ease forwards;}
@keyframes popUp{0%{opacity:1;transform:translateY(0) scale(1)}60%{opacity:1;transform:translateY(-45px) scale(1.15)}100%{opacity:0;transform:translateY(-80px) scale(0.9)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* signal travel animation between phases */
.phase-signal{
  position:fixed;pointer-events:none;z-index:999;
  width:12px;height:12px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 12px var(--cyan),0 0 24px var(--cyan);
  display:none;
}

@media(max-width:520px){
  .ctrl-row{flex-direction:column;}
  .wave-btns{flex-wrap:wrap;}
  .trt-diagram{flex-wrap:wrap;}
}
</style>
</head>
<body>
<div class="phase-signal" id="phaseSig"></div>
<div class="page">

<header>
  <div class="htag">// TELECOMUNICACIONES · GENERACIÓN Y AMPLIFICACIÓN DE ONDAS</div>
  <h1>⚡ CADENA DE SEÑAL</h1>
  <p class="hsub">Oscilador → Transistor → Amplificador · 3 etapas encadenadas</p>
</header>

<!-- CHAIN DIAGRAM -->
<div class="chain-diagram" id="chainDiagram">
  <div class="chain-block active-block" id="cb0" onclick="goPhase(1)">
    <span class="chain-icon">🔵</span>
    <span class="chain-label blue" id="cl0">OSCILADOR</span>
  </div>
  <div class="chain-arrow" id="ca0">
    <div class="arrow-line" id="al0"><div class="arrow-head"></div><div class="sig-particle" id="sp0"></div></div>
  </div>
  <div class="chain-block" id="cb1" onclick="goPhase(2)">
    <span class="chain-icon">🟡</span>
    <span class="chain-label" id="cl1">TRANSISTOR</span>
  </div>
  <div class="chain-arrow" id="ca1">
    <div class="arrow-line" id="al1"><div class="arrow-head"></div><div class="sig-particle" id="sp1"></div></div>
  </div>
  <div class="chain-block" id="cb2" onclick="goPhase(3)">
    <span class="chain-icon">🔴</span>
    <span class="chain-label" id="cl2">AMPLIFICADOR</span>
  </div>
</div>

<div class="score-bar">
  <div class="schip"><span class="val" id="scoreVal">0</span><span class="lbl">PTS</span></div>
  <div class="schip"><span class="val" id="corrVal">0</span><span class="lbl">ACIERTOS</span></div>
  <div class="schip"><span class="val" id="phaseVal">1/3</span><span class="lbl">ETAPA</span></div>
</div>

<div class="phase-bar">
  <div class="phase-step active" id="pstep1" onclick="goPhase(1)">1 · OSCILADOR</div>
  <div class="phase-step"        id="pstep2" onclick="goPhase(2)">2 · TRANSISTOR</div>
  <div class="phase-step"        id="pstep3" onclick="goPhase(3)">3 · AMPLIFICADOR</div>
</div>

<div id="gameArea"></div>
<div class="results-card" id="resultsCard"></div>

</div>
<script>
// ═══════════════════ STATE ═══════════════════
let score=0, corrCount=0, wrongCount=0;
let currentPhase=1;
let waveType='sine', f1Freq=3, f1Amp=0.6;
let f1Anim=null, f1Phase=0;
let trtBase=0.3, trtAnim=null, trtPhase=0;
let ampGain=1, ampAnim=null, ampPhase=0;

// Saved state from previous phases
let savedWaveType='sine', savedFreq=3, savedAmp=0.6;
let savedTrtBase=0.3;

// ═══════════════════ NAV ═══════════════════
function goPhase(n){
  stopAllAnims();
  currentPhase=n;
  [1,2,3].forEach(i=>{
    const el=document.getElementById('pstep'+i);
    el.className='phase-step'+(i===n?' active':'')+(i!==n&&el.classList.contains('done')?' done':'');
  });
  document.getElementById('phaseVal').textContent=n+'/3';
  document.getElementById('resultsCard').classList.remove('show');
  updateChainDiagram();
  if(n===1) renderF1();
  else if(n===2) renderF2();
  else if(n===3) renderF3();
}

function stopAllAnims(){
  if(f1Anim){cancelAnimationFrame(f1Anim);f1Anim=null;}
  if(trtAnim){cancelAnimationFrame(trtAnim);trtAnim=null;}
  if(ampAnim){cancelAnimationFrame(ampAnim);ampAnim=null;}
}

function markDone(n){
  document.getElementById('pstep'+n).classList.add('done');
  document.getElementById('cb'+(n-1)).classList.remove('active-block');
  document.getElementById('cb'+(n-1)).classList.add('done-block');
  document.getElementById('cl'+(n-1)).classList.add('done');
  if(n<=2){
    document.getElementById('al'+(n-1)).classList.add('done-arrow');

function setRange(id,min,max,val,cls){

  if(!el)return;

function showPop(text,color){
  const el=document.createElement('div');el.className='pts-pop';el.textContent=text;el.style.color=color;
  const bar=document.querySelector('.score-bar');const r=bar.getBoundingClientRect();
  el.style.top=(r.top+window.scrollY-10)+'px';el.style.left=(r.left+r.width/2-20)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1200);

function drawWave(canvasId, freq, amp, color, phase, type='sine', blocked=false, height=100){
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const W=canvas.parentElement.offsetWidth||400;canvas.width=W;canvas.height=height;
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,W,height);
  // grid
  ctx.strokeStyle='rgba(30,45,64,0.8)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,height/2);ctx.lineTo(W,height/2);ctx.stroke();
  for(let x=0;x<W;x+=W/8){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,height);
    ctx.strokeStyle='rgba(30,45,64,0.4)';ctx.stroke();}
  if(blocked){
    // flat line
    ctx.strokeStyle=color+'44';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,height/2);ctx.lineTo(W,height/2);ctx.stroke();
    return;
  }
  const g=ctx.createLinearGradient(0,0,W,0);
  g.addColorStop(0,color+'66');g.addColorStop(0.5,color);g.addColorStop(1,color+'66');
  ctx.strokeStyle=g;ctx.lineWidth=2.5;ctx.shadowColor=color;ctx.shadowBlur=8;
  ctx.beginPath();
  for(let x=0;x<=W;x++){
    let y;const t=2*Math.PI*freq*(x/W)+phase;
    if(type==='sine') y=height/2-amp*(height*0.38)*Math.sin(t);
    else if(type==='square') y=height/2-amp*(height*0.38)*Math.sign(Math.sin(t));
    else y=height/2-amp*(height*0.38)*(2/Math.PI)*Math.asin(Math.sin(t));
    x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();ctx.shadowBlur=0;
}

function setTrtBase(v){

function getTrtState(){
  if(trtBase<0.15) return 0; // open
  if(trtBase<0.5) return 1;  // partial
  return 2;                   // closed
}

function updateTrtVisuals(){
  const state = getTrtState();
  const base  = trtBase;

  // ── gauges ──
  const gB  = document.getElementById('gaugeB');
  const gCE = document.getElementById('gaugeCE');
  const gCEv= document.getElementById('gauCEval');
  const msg = document.getElementById('trtMsg');
  if(gB)  gB.style.width  = (base*100)+'%';

  // CE current proportional to base (0 below threshold, then linear)
  const ceRaw = base < 0.15 ? 0 : Math.min((base-0.15)/0.85, 1);
  const cePct = Math.round(ceRaw*100);
  if(gCE) gCE.style.width = cePct+'%';
  if(gCEv) gCEv.textContent = cePct+'%';

  if(msg){
    if(state===0) msg.textContent = '⛔ Base = 0 · Interruptor abierto';
    else if(state===1) msg.textContent = '⚡ Base baja · Corriente parcial';
    else msg.textContent = '✅ Base ≥ umbral · Corriente máxima';
  }

  // ── state badge ──
  const badge = document.getElementById('trtStateBadge');
  const icon  = document.getElementById('trtStateIcon');
  const lbl   = document.getElementById('trtStateLabel');
  if(badge){
    if(state===0){ badge.style.borderColor='rgba(244,67,54,0.4)';badge.style.background='rgba(244,67,54,0.05)'; }
    else if(state===1){ badge.style.borderColor='rgba(255,193,7,0.4)';badge.style.background='rgba(255,193,7,0.05)'; }
    else{ badge.style.borderColor='rgba(0,230,118,0.4)';badge.style.background='rgba(0,230,118,0.05)'; }
  }
  if(icon) icon.textContent = ['🔴','🟡','🟢'][state];
  if(lbl){
    lbl.textContent = ['ABIERTO','PARCIAL','CERRADO'][state];
    lbl.style.color = ['#f44336','#ffc107','#00e676'][state];
  }

  // ── SVG elements ──
  function svgColor(id, col){ const e=document.getElementById(id); if(e) e.setAttribute('stroke',col); }
  function svgFill(id, col){  const e=document.getElementById(id); if(e) e.setAttribute('fill',col);   }

  const cBase  = base>0.05 ? '#ffc107' : '#1e2d40';
  const cCE    = state===0 ? '#1e2d40' : state===1 ? '#1565c0' : '#2196f3';
  const cArrow = state===0 ? '#1e2d40' : state===1 ? '#1565c0' : '#2196f3';
  const cDiag  = state===0 ? '#1e2d40' : '#2196f3';
  const cBody  = state===0 ? '#0a1117' : state===1 ? '#0d1520' : '#0d1a28';
  const cBodyTxt = state===0 ? '#3a5268' : state===1 ? '#1565c0' : '#2196f3';

  svgColor('svgWireB', cBase);
  svgFill ('svgBaseArrow', cBase);
  svgColor('svgWireC', cCE);
  svgColor('svgWireE', cArrow);
  svgColor('svgDiagC', cDiag);
  svgColor('svgDiagE', cDiag);
  svgFill ('svgArrow',  cDiag);
  svgFill ('svgBody',   cBody);
  const bodyTxt=document.getElementById('svgBodyTxt');
  if(bodyTxt) bodyTxt.setAttribute('fill', cBodyTxt);
  // body circle border
  const bodyCirc=document.querySelector('#trtSVG circle');
  if(bodyCirc) bodyCirc.setAttribute('stroke', state===0?'#1e2d40':state===1?'#1565c0':'#2196f3');

  // current bar: fills from top of body upward proportional to CE
  const barEl=document.getElementById('svgCurrentBar');
  if(barEl){
    const maxH=72; // length of C wire
    const h=Math.round(ceRaw*maxH);
    barEl.setAttribute('y', 72-h);
    barEl.setAttribute('height', h);
    barEl.setAttribute('fill', state===0?'#1e2d40':state===1?'#1565c080':'#2196f3aa');
  }
}

function startTrtAnim(){
  if(trtAnim)cancelAnimationFrame(trtAnim);
  function loop(){
    const state=getTrtState();
    const outAmp=state===0?0:state===1?savedAmp*0.35:savedAmp;
    const blocked=state===0;
    drawWave('c2in',savedFreq,savedAmp,'#2196f3',trtPhase,savedWaveType,false,90);
    drawWave('c2out',savedFreq,outAmp,'#00e676',trtPhase,savedWaveType,blocked,90);
    trtPhase+=0.04;
    trtAnim=requestAnimationFrame(loop);
  }
  loop();
}

function answerF2(btn, correct){
  if(document.querySelector('#f2fb.ok.show')) return;
  if(correct){
    btn.classList.add('correct');
    document.querySelectorAll('.quiz-opt').forEach(b=>b.disabled=true);
    const firstTry=!document.querySelector('.quiz-opt.wrong');
    const pts=firstTry?100:50; score+=pts;corrCount++;updateScore();showPop('+'+pts,'#00e676');
    document.getElementById('f2fb').className='feedback-box ok show';
    document.getElementById('f2fb').textContent='✅ Correcto. La Base (B) es el terminal de control. Una pequeña corriente en B permite que una corriente mucho mayor fluya de C a E. Sin corriente en B, el transistor está "abierto" y bloquea la señal.';
    document.getElementById('f2next').classList.add('show');
  } else {
    btn.classList.add('wrong');btn.disabled=true;
    score=Math.max(0,score-10);wrongCount++;updateScore();showPop('-10','#f44336');
    document.getElementById('f2fb').className='feedback-box hint show';
    document.getElementById('f2fb').textContent='💡 Recuerda: el transistor tiene 3 terminales B (Base), C (Colector) y E (Emisor). La corriente principal va de C a E, pero quien decide si pasa o no es la B.';
  }
}

function nextF2(){
  savedTrtBase=trtBase;
  stopAllAnims();markDone(2);goPhase(3);
}

// ═══════════════════════════════════════════
// FASE 3 — AMPLIFICADOR
// ═══════════════════════════════════════════
function renderF3(){
  document.getElementById('gameArea').innerHTML=`
    <div class="lab-card">
      <div class="lab-head">
        <span class="phase-tag tag-red">ETAPA 3</span>
        <h2>Amplificador — Aumentar la potencia de la señal</h2>
      </div>
      <div class="lab-body">
        <div class="info-box">
          La <strong>amplificación</strong> toma la señal y aumenta su amplitud sin cambiar su forma. Una pequeña señal de entrada controla el paso de una cantidad mayor de energía desde la fuente de alimentación — las variaciones de entrada se replican como grandes variaciones en la salida.
        </div>

        <div class="ctrl-row">
          <div class="ctrl-group">
            <div class="ctrl-label">GANANCIA <span class="red" id="ampGv">×1</span></div>
            <input type="range" id="ampGs" class="red-range" min="1" max="5" step="0.5" value="${ampGain}" oninput="setAmpGain(this.value)">
          </div>
        </div>

        <div class="gain-display">
          <div class="gain-val" id="gainBig">×${ampGain.toFixed(1)}</div>
          <div class="gain-info">
            <div class="gain-info-title">// AMPLIFICACIÓN</div>
            <div class="gain-formula">Amplitud salida = <span id="gainFormula">${savedAmp.toFixed(2)}</span> × <span id="gainMult">${ampGain.toFixed(1)}</span> = <span id="gainResult">${(savedAmp*ampGain).toFixed(2)}</span></div>
          </div>
        </div>

        <div class="canvas-row">
          <div class="canvas-box" style="height:80px">
            <span class="canvas-tag yellow">SEÑAL ENTRADA (pequeña)</span>
            <canvas id="c3in" height="80"></canvas>
          </div>
          <div class="canvas-box" style="height:130px">
            <span class="canvas-tag red out">SEÑAL SALIDA (amplificada)</span>
            <canvas id="c3out" height="130"></canvas>
          </div>
        </div>

        <div class="quiz-box">
          <div class="quiz-q">❓ Al amplificar una señal senoidal con ganancia ×3, ¿qué ocurre con su FORMA?</div>
          <div class="quiz-opts">
            ${[
              {t:'Se convierte en onda cuadrada', c:false},
              {t:'La forma NO cambia, solo aumenta la amplitud', c:true},
              {t:'La frecuencia se multiplica por 3', c:false},
              {t:'Se distorsiona y pierde su forma', c:false},
            ].map(o=>`<button class="quiz-opt" onclick="answerF3(this,${o.c})">${o.t}</button>`).join('')}
          </div>
          <div class="feedback-box" id="f3fb"></div>
        </div>

        <div class="quiz-box" id="q3b" style="display:none">
          <div class="quiz-q">❓ En la cadena completa: Oscilador → Transistor → Amplificador, ¿cuál es la función del transistor?</div>
          <div class="quiz-opts">
            ${[
              {t:'Genera la onda desde cero', c:false},
              {t:'Controla si la señal pasa o no (interruptor)', c:true},
              {t:'Aumenta la potencia de la señal', c:false},
            ].map(o=>`<button class="quiz-opt" id="q3b_opt" onclick="answerF3b(this,${o.c})">${o.t}</button>`).join('')}
          </div>
          <div class="feedback-box" id="f3bfb"></div>
        </div>

        <button class="next-btn" id="f3next" onclick="showResults()">Ver resultados de la cadena completa →</button>
      </div>
    </div>`;
  setRange('ampGs',1,5,ampGain,'red-range');
  startAmpAnim();
}

function setAmpGain(v){
  ampGain=parseFloat(v);
  document.getElementById('ampGv').textContent='×'+v;
  document.getElementById('gainBig').textContent='×'+parseFloat(v).toFixed(1);
  document.getElementById('gainMult').textContent=parseFloat(v).toFixed(1);
  document.getElementById('gainFormula').textContent=savedAmp.toFixed(2);
  document.getElementById('gainResult').textContent=(savedAmp*ampGain).toFixed(2);
  setRange('ampGs',1,5,v,'red-range');
}

function startAmpAnim(){
  if(ampAnim)cancelAnimationFrame(ampAnim);
  const IN_AMP = 0.18; // entrada siempre pequeña para que el contraste sea visible
  function loop(){
    const outAmp = Math.min(IN_AMP * ampGain, 0.92);
    drawWave('c3in', savedFreq, IN_AMP,  '#ffc107', ampPhase, savedWaveType, false, 80);
    drawWave('c3out',savedFreq, outAmp,  '#f44336', ampPhase, savedWaveType, false, 130);
    ampPhase+=0.04;
    ampAnim=requestAnimationFrame(loop);
  }
  loop();
}

let f3aAnswered=false;
function answerF3(btn, correct){
  if(f3aAnswered) return;
  if(correct){
    f3aAnswered=true;
    btn.classList.add('correct');
    document.querySelectorAll('.quiz-opt:not([id])').forEach(b=>b.disabled=true);
    const firstTry=!document.querySelector('.quiz-opt:not([id]).wrong');
    const pts=firstTry?100:50;score+=pts;corrCount++;updateScore();showPop('+'+pts,'#00e676');
    document.getElementById('f3fb').className='feedback-box ok show';
    document.getElementById('f3fb').textContent='✅ Exacto. La amplificación SOLO cambia la amplitud (altura de la onda), no su forma ni su frecuencia. Una senoidal amplificada sigue siendo senoidal, solo más grande.';
    setTimeout(()=>document.getElementById('q3b').style.display='block', 800);
  } else {
    btn.classList.add('wrong');btn.disabled=true;
    score=Math.max(0,score-10);wrongCount++;updateScore();showPop('-10','#f44336');
    document.getElementById('f3fb').className='feedback-box hint show';
    document.getElementById('f3fb').textContent='💡 Observa los dos canales del osciloscopio: la forma de la onda de salida (roja) es idéntica a la de entrada (amarilla). Solo su altura (amplitud) es mayor.';
  }
}

let f3bAnswered=false;
function answerF3b(btn, correct){
  if(f3bAnswered) return;
  if(correct){
    f3bAnswered=true;
    btn.classList.add('correct');
    document.querySelectorAll('#q3b .quiz-opt').forEach(b=>b.disabled=true);
    const pts=100;score+=pts;corrCount++;updateScore();showPop('+'+pts,'#00e676');
    document.getElementById('f3bfb').className='feedback-box ok show';
    document.getElementById('f3bfb').textContent='✅ Correcto. El transistor es el interruptor: decide si la señal generada por el oscilador llega o no al amplificador. Cada etapa tiene su función específica en la cadena.';
    markDone(3);
    setTimeout(()=>document.getElementById('f3next').classList.add('show'), 600);
  } else {
    btn.classList.add('wrong');btn.disabled=true;
    score=Math.max(0,score-10);wrongCount++;updateScore();showPop('-10','#f44336');
    document.getElementById('f3bfb').className='feedback-box hint show';
    document.getElementById('f3bfb').textContent='💡 Repasa la cadena: el Oscilador GENERA, el Transistor CONTROLA (abre/cierra el paso), el Amplificador AMPLIFICA. Cada etapa tiene un rol diferente.';
  }
}

// ═══════════════════════════════════════════
// RESULTS
// ═══════════════════════════════════════════
function showResults(){
  stopAllAnims();
  document.getElementById('gameArea').innerHTML='';
  const max=100+100+100+100; // 4 preguntas
  const pct=Math.round((score/max)*100);
  let emoji,title,msg;
  if(pct>=90){emoji='🏆';title='¡CADENA DOMINADA!';msg='Comprendes perfectamente la generación, control y amplificación de señales.';}
  else if(pct>=65){emoji='⚡';title='¡CIRCUITO COMPLETADO!';msg='Sólida comprensión de la cadena de señal. Repasa el papel de cada componente.';}
  else if(pct>=40){emoji='📡';title='¡SEÑAL RECIBIDA!';msg='Los conceptos básicos están claros. Repasa las funciones del transistor y el amplificador.';}
  else{emoji='🔧';title='CALIBRANDO...';msg='Vuelve a repasar las tres etapas de la cadena de señal e inténtalo de nuevo.';}

  const rc=document.getElementById('resultsCard');
  rc.innerHTML=`
    <span class="res-emoji">${emoji}</span>
    <div class="res-title">${title}</div>
    <div class="res-score">${score} pts</div>
    <div class="res-sub">${msg}</div>
    <div class="chain-summary">
      <div class="chain-sum-block" style="background:rgba(33,150,243,0.06)">
        <div class="csb-icon">🔵</div>
        <div class="csb-label">OSCILADOR</div>
        <div class="csb-value">DC → AC</div>
        <div style="font-size:11px;color:var(--text3);margin-top:4px">${['Senoidal','Cuadrada','Triangular'][['sine','square','triangle'].indexOf(savedWaveType)]} · ${savedFreq} Hz</div>
      </div>
      <div class="chain-sum-block" style="background:rgba(255,193,7,0.06)">
        <div class="csb-icon">🟡</div>
        <div class="csb-label">TRANSISTOR</div>
        <div class="csb-value">${savedTrtBase>=0.5?'CERRADO ✓':savedTrtBase>=0.15?'PARCIAL ⚠':'ABIERTO ✗'}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:4px">Base: ${Math.round(savedTrtBase*100)}%</div>
      </div>
      <div class="chain-sum-block" style="background:rgba(244,67,54,0.06)">
        <div class="csb-icon">🔴</div>
        <div class="csb-label">AMPLIFICADOR</div>
        <div class="csb-value">Ganancia ×${ampGain.toFixed(1)}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:4px">Amp. salida: ${Math.min(savedAmp*ampGain,0.95).toFixed(2)}</div>
      </div>
    </div>
    <div class="res-stats">
      <div class="rstat"><div class="rstat-v">${corrCount}</div><div class="rstat-l">ACIERTOS</div></div>
      <div class="rstat"><div class="rstat-v">${wrongCount}</div><div class="rstat-l">FALLOS</div></div>
      <div class="rstat"><div class="rstat-v">${pct}%</div><div class="rstat-l">DEL MÁX.</div></div>
    </div>
    <button class="restart-btn" onclick="restartGame()">⟳ REINICIAR CADENA</button>`;
  rc.classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
}

function restartGame(){
  score=0;corrCount=0;wrongCount=0;
  waveType='sine';f1Freq=3;f1Amp=0.6;f1Phase=0;
  trtBase=0.3;trtPhase=0;ampGain=1;ampPhase=0;
  savedWaveType='sine';savedFreq=3;savedAmp=0.6;savedTrtBase=0.3;
  f3aAnswered=false;f3bAnswered=false;
  document.getElementById('resultsCard').classList.remove('show');
  [1,2,3].forEach(i=>{
    const s=document.getElementById('pstep'+i);
    s.className='phase-step'+(i===1?' active':'');
    const cb=document.getElementById('cb'+(i-1));
    cb.classList.remove('done-block','active-block');
    if(i===1)cb.classList.add('active-block');
    document.getElementById('cl'+(i-1)).className='chain-label '+['blue','',''][i-1];
    const al=document.getElementById('al'+(i-1));
    if(al){al.classList.remove('active-arrow','done-arrow');const sp=al.querySelector('.sig-particle');if(sp)sp.classList.remove('running');}
  });
  updateScore();
  goPhase(1);
  window.scrollTo({top:0,behavior:'smooth'});
}

// INIT
renderF1();
</script>
</body>
</html>
