
<style>
*{box-sizing:border-box;margin:0;padding:0}
canvas{display:block;width:100%}
.ctrl{display:flex;gap:10px;justify-content:center;padding:10px 0 4px;flex-wrap:wrap}
button{padding:9px 22px;border-radius:8px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:13px;font-weight:500;cursor:pointer;transition:all .18s}
button:hover{background:var(--color-background-secondary)}
button.active{background:#EAF3DE;border-color:#639922;color:#27500A}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.tbl th{padding:7px 12px;text-align:center;font-weight:500;font-size:11px;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.tbl td{padding:8px 12px;text-align:center;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);font-size:14px;transition:background .25s,color .25s}
.tbl tr.hi td{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:500}
.tbl tr.hi td.g{color:#27500A;background:#EAF3DE}
.tbl tr.hi td.r{color:#A32D2D;background:#FCEBEB}
.leg{display:flex;gap:14px;justify-content:center;padding:6px 0 2px;flex-wrap:wrap;font-size:11px;color:var(--color-text-secondary)}
.ld{width:24px;height:3px;display:inline-block;vertical-align:middle;margin-right:3px;border-radius:2px}
</style>

<canvas id="cv" width="680" height="380"></canvas>
<div class="ctrl">
  <button id="bA0" onclick="setA(0)">A = 0</button>
  <button id="bA1" onclick="setA(1)">A = 1</button>
  <span style="width:20px"></span>
  <button id="bB0" onclick="setB(0)">B = 0</button>
  <button id="bB1" onclick="setB(1)">B = 1</button>
</div>
<div class="leg">
  <span><span class="ld" style="background:#378ADD"></span>Entrada base</span>
  <span><span class="ld" style="background:#639922"></span>Transistor ON</span>
  <span><span class="ld" style="background:#cccccc"></span>Transistor OFF</span>
  <span><span class="ld" style="background:#f0b830"></span>+Vcc</span>
</div>
<div style="padding:0 16px 12px">
  <table class="tbl">
    <thead><tr><th>Entrada A</th><th>Entrada B</th><th>T1 (base A)</th><th>T2 (base B)</th><th>Salida NAND</th><th>Por qué</th></tr></thead>
    <tbody>
      <tr id="r00"><td>0</td><td>0</td><td>OFF</td><td>OFF</td><td class="g">1</td><td style="font-size:11px;text-align:left">T1 y T2 abiertos — corriente sube a la salida</td></tr>
      <tr id="r01"><td>0</td><td>1</td><td>OFF</td><td>ON</td><td class="g">1</td><td style="font-size:11px;text-align:left">T1 abierto corta el camino a GND</td></tr>
      <tr id="r10"><td>1</td><td>0</td><td>ON</td><td>OFF</td><td class="g">1</td><td style="font-size:11px;text-align:left">T2 abierto corta el camino a GND</td></tr>
      <tr id="r11"><td>1</td><td>1</td><td>ON</td><td>ON</td><td class="r">0</td><td style="font-size:11px;text-align:left">Los dos cerrados — corriente drena a GND</td></tr>
    </tbody>
  </table>
</div>

<script>
var A=0, B=0, frame=0, particles=[];

function setA(v){
  A=v;
  document.getElementById('bA0').className=v===0?'active':'';
  document.getElementById('bA1').className=v===1?'active':'';
  updateTable(); particles=[];
}
function setB(v){
  B=v;
  document.getElementById('bB0').className=v===0?'active':'';
  document.getElementById('bB1').className=v===1?'active':'';
  updateTable(); particles=[];
}
function updateTable(){
  ['r00','r01','r10','r11'].forEach(function(id){
    document.getElementById(id).className='';
  });
  document.getElementById('r'+A+B).className='hi';
}
// Estado inicial
document.getElementById('bA0').className='active';
document.getElementById('bB0').className='active';
updateTable();

// Dibuja símbolo NPN. Colector arriba-derecha, emisor abajo-derecha, base izquierda
// Retorna {b, c, e} puntos externos
function drawNPN(ctx, cx, cy, isOn, dark){
  var R=22;
  var wOn='#639922', wOff=dark?'#3a3a3a':'#cccccc';
  var wc=isOn?wOn:wOff;
  var fill=isOn?(dark?'#0d1f0d':'#eaf3de'):(dark?'#1e1e1e':'#f5f5f5');
  var stroke=isOn?'#639922':(dark?'#444':'#bbb');

  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.fillStyle=fill;ctx.fill();
  ctx.strokeStyle=stroke;ctx.lineWidth=isOn?1.8:1;ctx.stroke();

  ctx.strokeStyle=wc;ctx.lineWidth=2.2;
  // línea vertical base
  ctx.beginPath();ctx.moveTo(cx-9,cy-16);ctx.lineTo(cx-9,cy+16);ctx.stroke();
  // colector
  ctx.beginPath();ctx.moveTo(cx-9,cy-11);ctx.lineTo(cx+15,cy-26);ctx.stroke();
  // emisor
  ctx.beginPath();ctx.moveTo(cx-9,cy+11);ctx.lineTo(cx+15,cy+26);ctx.stroke();
  // flecha emisor
  var ex=cx+15,ey=cy+26,ang=Math.atan2(15,24);
  ctx.fillStyle=wc;
  ctx.beginPath();
  ctx.moveTo(ex,ey);
  ctx.lineTo(ex-9*Math.cos(ang-0.5),ey-9*Math.sin(ang-0.5));
  ctx.lineTo(ex-9*Math.cos(ang+0.5),ey-9*Math.sin(ang+0.5));
  ctx.closePath();ctx.fill();
  // cable base
  ctx.strokeStyle=wc;ctx.lineWidth=2.2;
  ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx-9,cy);ctx.stroke();

  return {b:{x:cx-R,y:cy}, c:{x:cx+15,y:cy-26}, e:{x:cx+15,y:cy+26}};
}

function wire(ctx,x1,y1,x2,y2,col,w){
  ctx.strokeStyle=col;ctx.lineWidth=w||2;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function poly(ctx,pts,col,w){
  ctx.strokeStyle=col;ctx.lineWidth=w||2;ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();
}
function dot(ctx,x,y,col){
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();
}
function vccLabel(ctx,x,y,dark){
  ctx.fillStyle=dark?'#2a2a00':'#fffbe6';
  ctx.strokeStyle=dark?'#665500':'#ccaa00';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(x-28,y-18,56,18,4);ctx.fill();ctx.stroke();
  ctx.fillStyle='#886600';ctx.font='10px sans-serif';ctx.textAlign='center';
  ctx.fillText('Vcc  +5V',x,y-5);
}
function gndSym(ctx,x,y,dark){
  var c=dark?'#444':'#bbb';ctx.strokeStyle=c;ctx.lineWidth=1.5;
  [[18,0],[12,6],[6,12]].forEach(function(r){
    ctx.beginPath();ctx.moveTo(x-r[0],y+r[1]);ctx.lineTo(x+r[0],y+r[1]);ctx.stroke();
  });
}
function inputBtn(ctx,x,y,lbl,val,dark){
  var on=val===1;
  ctx.fillStyle=on?(dark?'#0d1f0d':'#eaf3de'):(dark?'#1e1e1e':'#f5f5f5');
  ctx.strokeStyle=on?'#639922':(dark?'#3a3a3a':'#bbb');ctx.lineWidth=1.2;
  ctx.beginPath();ctx.roundRect(x-22,y-16,44,32,6);ctx.fill();ctx.stroke();
  ctx.fillStyle=on?'#27500A':(dark?'#777':'#999');
  ctx.font='bold 11px sans-serif';ctx.textAlign='center';
  ctx.fillText(lbl,x,y-2);
  ctx.font='10px sans-serif';
  ctx.fillText(val===1?'= 1':'= 0',x,y+12);
}
function outputLED(ctx,x,y,on,dark){
  var col=on?'#639922':'#E24B4A';
  var fill=on?(dark?'#0d1f0d':'#eaf3de'):(dark?'#2a0808':'#FCEBEB');
  ctx.fillStyle=fill;ctx.strokeStyle=col;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle=col;ctx.font='bold 12px sans-serif';ctx.textAlign='center';
  ctx.fillText(on?'1':'0',x,y+5);
  ctx.fillStyle=col;ctx.font='9px sans-serif';
  ctx.fillText('NAND',x,y+20);
}

function loop(){
  var cv=document.getElementById('cv');
  var ctx=cv.getContext('2d');
  var W=680,H=380;
  ctx.clearRect(0,0,W,H);
  frame++;

  var dark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  var tx=dark?'#666':'#999';
  var wOn='#639922', wOff=dark?'#3a3a3a':'#cccccc';
  var wB='#378ADD', wVcc='#f0b830';

  var out=(A&&B)?0:1;
  var t1on=(A===1), t2on=(B===1);
  var flowThrough=(t1on&&t2on);

  // ── Posiciones centrales de los dos transistores ──
  // T1 (base = entrada A) centrado en (300, 155)
  // T2 (base = entrada B) centrado en (300, 285)
  var T1cx=300, T1cy=155;
  var T2cx=300, T2cy=285;

  var VY=30, GY=358;
  var outX=440, outY=(T1cy+T2cy)/2; // nodo de salida

  var wL=flowThrough?wOn:wOff; // color del tren colector-emisor

  // Vcc
  vccLabel(ctx,T1cx,VY,dark);

  // Cable Vcc → colector T1
  var p1=drawNPN(ctx,T1cx,T1cy,t1on,dark);
  wire(ctx,T1cx,VY+2,p1.c.x,p1.c.y,wVcc,2);

  // Cable emisor T1 → colector T2 (serie)
  var p2=drawNPN(ctx,T2cx,T2cy,t2on,dark);
  // van por la derecha en x=outX-20 para no solapar
  var serX=outX-20;
  poly(ctx,[[p1.e.x,p1.e.y],[serX,p1.e.y],[serX,p2.c.y],[p2.c.x,p2.c.y]],wL,2);

  // Nodo de salida (entre emisor T1 y colector T2)
  var nodeY=(p1.e.y+p2.c.y)/2;
  dot(ctx,serX,nodeY,out?wOn:wOff);

  // Cable de salida → LED
  wire(ctx,serX,nodeY,outX+20,nodeY,out?wOn:wOff,2);

  // Cable emisor T2 → GND
  poly(ctx,[[p2.e.x,p2.e.y],[serX,p2.e.y],[serX,GY]],wL,2);
  gndSym(ctx,serX,GY+2,dark);

  // ── Resistencia de pull-up (Vcc → nodo salida) ──
  // Resistencia entre Vcc y el nodo de salida, por la izquierda
  var resX=220, resTopY=VY+2, resBotY=nodeY;
  wire(ctx,T1cx,VY+2,resX,VY+2,wVcc,1.5);
  // Símbolo resistencia en (resX, entre VY y nodeY)
  var resMidY=(resTopY+resBotY)/2;
  wire(ctx,resX,resTopY,resX,resMidY-22,wVcc,1.5);
  // Zigzag
  ctx.strokeStyle=wVcc;ctx.lineWidth=1.5;ctx.beginPath();
  var rz=resMidY-22;
  ctx.moveTo(resX,rz);
  for(var i=0;i<5;i++){
    ctx.lineTo(resX+(i%2===0?10:-10),rz+8+i*8);
  }
  ctx.lineTo(resX,rz+48);
  ctx.stroke();
  wire(ctx,resX,rz+48,resX,resBotY,wVcc,1.5);
  // Cable resistencia → nodo salida
  wire(ctx,resX,resBotY,serX,resBotY,out?wOn:wOff,1.5);
  dot(ctx,serX,resBotY,out?wOn:wOff);
  // Etiqueta Rc
  ctx.fillStyle='#997700';ctx.font='9px sans-serif';ctx.textAlign='left';
  ctx.fillText('Rc',resX+13,resMidY+4);

  // ── LED salida ──
  outputLED(ctx,outX+46,nodeY,out===1,dark);

  // ── Entradas base ──
  // Entrada A → base T1
  var aX=100, aY=T1cy;
  inputBtn(ctx,aX,aY,'A',A,dark);
  wire(ctx,aX+22,aY,p1.b.x,p1.b.y,wB,1.8);
  ctx.fillStyle=wB;ctx.font='9px sans-serif';ctx.textAlign='center';
  ctx.fillText('Base T1',aX+60,aY-14);

  // Entrada B → base T2
  var bX=100, bY=T2cy;
  inputBtn(ctx,bX,bY,'B',B,dark);
  wire(ctx,bX+22,bY,p2.b.x,p2.b.y,wB,1.8);
  ctx.fillStyle=wB;ctx.font='9px sans-serif';ctx.textAlign='center';
  ctx.fillText('Base T2',bX+60,bY+16);

  // ── Etiquetas T1 / T2 ──
  ctx.fillStyle=tx;ctx.font='9px sans-serif';ctx.textAlign='left';
  ctx.fillText('T1',T1cx+24,T1cy-28);
  ctx.fillText('T2',T2cx+24,T2cy-28);

  // B C E labels
  ctx.font='8px sans-serif';ctx.fillStyle=tx;
  ctx.textAlign='right';
  ctx.fillText('B',p1.b.x-4,p1.b.y+3);
  ctx.fillText('B',p2.b.x-4,p2.b.y+3);
  ctx.textAlign='left';
  ctx.fillText('C',p1.c.x+3,p1.c.y+3);
  ctx.fillText('E',p1.e.x+3,p1.e.y+3);
  ctx.fillText('C',p2.c.x+3,p2.c.y+3);
  ctx.fillText('E',p2.e.x+3,p2.e.y+3);

  // ── Caja puerta NAND ──
  ctx.save();
  ctx.strokeStyle=dark?'#1a3a5a':'#b5d4f4';ctx.lineWidth=1;ctx.setLineDash([5,4]);
  ctx.beginPath();ctx.roundRect(210,70,165,260,10);ctx.stroke();
  ctx.fillStyle=dark?'rgba(55,138,221,0.05)':'rgba(55,138,221,0.04)';ctx.fill();
  ctx.setLineDash([]);ctx.restore();
  ctx.fillStyle='#378ADD';ctx.font='500 11px sans-serif';ctx.textAlign='center';
  ctx.fillText('Puerta NAND (interior)',292,65);

  // ── Leyenda estado actual ──
  var stateMsg=out?
    (flowThrough?'A=1 B=1 → los 2 TRT conducen → salida = 0':'A='+A+' B='+B+' → camino abierto → salida = 1'):
    'A=1 B=1 → ambos TRT ON → corriente drena a GND → salida = 0';
  if(!out) stateMsg='A=1  B=1 → T1 y T2 ON → corriente drena a GND → NAND = 0';
  else stateMsg='A='+A+'  B='+B+' → al menos un TRT OFF → salida sube por Rc → NAND = 1';
  ctx.fillStyle=out?'#27500A':'#A32D2D';ctx.font='500 11px sans-serif';ctx.textAlign='center';
  ctx.fillText(stateMsg,340,20);

  // ── Partículas (solo cuando hay corriente) ──
  if(flowThrough && frame%5===0){
    particles.push({y:T1cx,x:T1cx,gy:p1.c.y,prog:0});
  }
  particles=particles.filter(function(p){
    p.prog+=0.05;if(p.prog>=1)return false;
    var py=p.gy+(p.gy+100-p.gy)*p.prog;
    ctx.beginPath();ctx.arc(serX,p.gy+(nodeY-p.gy)*p.prog,3.5,0,Math.PI*2);
    ctx.fillStyle='rgba(99,153,34,0.8)';ctx.fill();
    return true;
  });

  requestAnimationFrame(loop);
}
loop();
</script>
