<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Pentaconta - Simulación de Conmutación</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #222;
            --lcd-bg: #2d5a27;
            --lcd-text: #5dfc5d;
            --led-off: #3a3a3a;
            --led-red: #ff3131;
            --led-green: #39ff14;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .main-frame {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            border: 3px solid #333;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            max-width: 950px;
            width: 100%;
        }

        /* Pantalla LCD */
        .lcd {
            background: var(--lcd-bg);
            color: var(--lcd-text);
            font-family: 'Courier New', monospace;
            padding: 15px;
            font-size: 1.5rem;
            border: 6px solid #111;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: left;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            height: 70px;
        }

        /* Matriz de LEDs */
        .matrix-container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #444;
        }

        .matrix-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .row-label {
            width: 100px;
            font-size: 0.7rem;
            color: #888;
            font-weight: bold;
        }

        .pixel-row {
            display: flex;
            gap: 12px;
        }

        .pixel {
            width: 25px;
            height: 25px;
            background: var(--led-off);
            border-radius: 3px;
            border: 1px solid #111;
            transition: 0.15s;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .pixel.active {
            background: var(--led-red);
            box-shadow: 0 0 15px var(--led-red), inset 0 0 5px white;
        }

        /* Teclado y Controles */
        .bottom-area {
            display: grid;
            grid-template-columns: 280px 1fr 200px;
            gap: 20px;
            align-items: start;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .key {
            background: #444;
            color: white;
            border: none;
            padding: 15px 5px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px #222;
        }

        .key:active { transform: translateY(2px); box-shadow: 0 2px #222; }
        .key.red-key { background: #8b0000; color: #ffbaba; font-size: 0.7rem; }

        /* EL BOTÓN DE COLGAR GRANDE */
        .handset-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .hangup-button {
            width: 100%;
            padding: 20px;
            background: #c0392b;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px #7b241c;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .hangup-button:hover { background: #e74c3c; }
        .hangup-button:active { transform: translateY(4px); box-shadow: 0 2px #7b241c; }

        .icon-phone { font-size: 24px; transform: rotate(135deg); }

        /* Indicadores */
        .indicator-panel {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .led-green {
            width: 30px;
            height: 30px;
            background: #003300;
            border-radius: 50%;
            border: 2px solid #222;
        }
        .led-green.active { background: var(--led-green); box-shadow: 0 0 20px var(--led-green); }

        .buzzer-box { text-align: center; font-size: 1.5rem; }

        #audio-init {
            background: #f1c40f;
            color: black;
            padding: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="audio-init" onclick="startCentral()">🔊 CLICK PARA INICIAR CENTRAL (PENTACONTA)</div>

    <div class="main-frame">
        <div class="lcd" id="lcd">
            <div id="lcd1">LISTO PARA</div>
            <div id="lcd2">MARCAR</div>
        </div>

        <div class="matrix-container" id="matrix"></div>

        <div class="bottom-area">
            <!-- Teclado -->
            <div class="keypad" id="keys">
                <button class="key">1</button><button class="key">2</button><button class="key">3</button><button class="key">A</button>
                <button class="key">4</button><button class="key">5</button><button class="key">6</button><button class="key">B</button>
                <button class="key">7</button><button class="key">8</button><button class="key">9</button><button class="key">C</button>
                <button class="key red-key" onclick="resetSystem()">COLGAR<br>*</button>
                <button class="key">0</button>
                <button class="key">#</button><button class="key">D</button>
            </div>

            <!-- Botón Grande de Colgar -->
            <div class="handset-container">
                <button class="hangup-button" onclick="resetSystem()">
                    <span class="icon-phone">📞</span>
                    <span>COLGAR LLAMADA</span>
                </button>
                <p style="font-size: 0.7rem; color: #666; text-align: center;">Simula la acción de poner el auricular en la base</p>
            </div>

            <!-- Indicadores -->
            <div class="indicator-panel">
                <div style="text-align:center;">
                    <div id="circuit-led" class="led-green"></div>
                    <small style="font-size:0.6rem;">CIRCUITO</small>
                </div>
                <div class="buzzer-box" id="buzzer-ui">🔈</div>
            </div>
        </div>
    </div>

    <script>
        let dialed = "";
        let audioCtx = null;
        let osc = null;
        let ringTimer = null;

        // Generar matriz
        const matrix = document.getElementById('matrix');
        for (let i = 0; i < 4; i++) {
            const row = document.createElement('div');
            row.className = 'matrix-row';
            row.innerHTML = `<div class="row-label">RELE DIGITO ${i+1}</div>`;
            const pixels = document.createElement('div');
            pixels.className = 'pixel-row';
            for (let j = 0; j < 10; j++) {
                const p = document.createElement('div');
                p.className = 'pixel';
                p.id = `p-${i}-${j}`;
                pixels.appendChild(p);
            }
            row.appendChild(pixels);
            matrix.appendChild(row);
        }

        function startCentral() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('audio-init').style.display = 'none';
            resetSystem();
        }

        function updateLCD(t1, t2 = "") {
            document.getElementById('lcd1').innerText = t1;
            document.getElementById('lcd2').innerText = t2;
        }

        function playTone(freq, type = 'sine') {
            if (!audioCtx) return;
            stopTone();
            osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            document.getElementById('buzzer-ui').innerText = "🔊";
        }

        function stopTone() {
            if (osc) { osc.stop(); osc = null; }
            document.getElementById('buzzer-ui').innerText = "🔈";
        }

        function resetSystem() {
            dialed = "";
            clearInterval(ringTimer);
            stopTone();
            document.querySelectorAll('.pixel').forEach(p => p.classList.remove('active'));
            document.getElementById('circuit-led').classList.remove('active');
            updateLCD("LISTO PARA", "MARCAR");
            if (audioCtx) playTone(440); // Tono de invitación
        }

        document.getElementById('keys').addEventListener('click', (e) => {
            if (!e.target.classList.contains('key') || e.target.innerText.includes('*')) return;
            const key = e.target.innerText;

            if (dialed.length < 4 && !isNaN(key)) {
                if (dialed.length === 0) stopTone();
                const row = dialed.length;
                dialed += key;
                updateLCD("MARCANDO:", dialed);
                document.getElementById(`p-${row}-${key}`).classList.add('active');

                if (dialed.length === 4) {
                    setTimeout(establishConnection, 600);
                }
            }
        });

        function establishConnection() {
            if (dialed === "1111") {
                updateLCD("LINEA", "OCUPADA");
                let s = true;
                ringTimer = setInterval(() => {
                    if (s) playTone(480, 'square'); else stopTone();
                    s = !s;
                }, 300);
            } else {
                updateLCD("CIRCUITO", "ESTABLECIDO");
                document.getElementById('circuit-led').classList.add('active');
                let phase = 0;
                ringTimer = setInterval(() => {
                    if (phase === 0) playTone(900);
                    else stopTone();
                    phase = (phase + 1) % 3;
                }, 1000);
            }
        }
    </script>
</body>
</html>
