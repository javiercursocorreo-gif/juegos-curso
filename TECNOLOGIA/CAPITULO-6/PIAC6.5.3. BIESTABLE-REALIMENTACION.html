
<style>
*{box-sizing:border-box;margin:0;padding:0}
canvas{display:block;width:100%}
.ctrl{display:flex;gap:10px;justify-content:center;padding:10px 0 4px;flex-wrap:wrap}
button{padding:9px 24px;border-radius:8px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:13px;font-weight:500;cursor:pointer;transition:all .18s}
button:hover{background:var(--color-background-secondary)}
button.son{background:#EAF3DE;border-color:#639922;color:#27500A}
button.ron{background:#FCEBEB;border-color:#E24B4A;color:#A32D2D}
.info{display:flex;gap:20px;justify-content:center;padding:6px 0 2px;font-size:13px;color:var(--color-text-secondary);flex-wrap:wrap}
.qbig{font-size:20px;font-weight:500}
.q1{color:#639922}.q0{color:#E24B4A}
.leg{display:flex;gap:14px;justify-content:center;padding:6px 0 0;flex-wrap:wrap;font-size:11px;color:var(--color-text-secondary)}
.ld{width:28px;height:3px;display:inline-block;vertical-align:middle;margin-right:4px;border-radius:2px}
</style>

<canvas id="cv" width="680" height="560"></canvas>
<div class="ctrl">
  <button id="bS" onclick="doSet()">Pulsar SET — guardar 1</button>
  <button id="bR" onclick="doReset()">Pulsar RESET — guardar 0</button>
</div>
<div class="info">
  <span>Q = <span class="qbig q0" id="qv">0</span></span>
  <span style="color:var(--color-border-secondary)">|</span>
  <span id="stlbl" style="font-weight:500;color:var(--color-text-primary)">RESET — guardado 0</span>
</div>
<div class="leg">
  <span><span class="ld" style="background:#378ADD"></span>Entrada (base)</span>
  <span><span class="ld" style="background:#639922"></span>Corriente activa</span>
  <span><span class="ld" style="background:#cccccc"></span>Circuito abierto</span>
  <span><span class="ld" style="background:#e07b00"></span>Realimentación cruzada</span>
</div>

<script>
var Q=0, frame=0, particles=[];

function doSet(){
  Q=1;
  document.getElementById('bS').className='son';
  document.getElementById('bR').className='';
  setTimeout(function(){document.getElementById('bS').className='';},500);
  document.getElementById('qv').textContent='1';
  document.getElementById('qv').className='qbig q1';
  document.getElementById('stlbl').textContent='SET — guardado 1';
  particles=[];
}
function doReset(){
  Q=0;
  document.getElementById('bS').className='';
  document.getElementById('bR').className='ron';
  setTimeout(function(){document.getElementById('bR').className='';},500);
  document.getElementById('qv').textContent='0';
  document.getElementById('qv').className='qbig q0';
  document.getElementById('stlbl').textContent='RESET — guardado 0';
  particles=[];
}

// Dibuja símbolo NPN esquemático real centrado en (cx,cy)
// colector arriba-derecha, emisor abajo-derecha, base a la izquierda
// Devuelve los 3 puntos de conexión externos: {b, c, e}
function drawNPN(ctx, cx, cy, isOn, dark){
  var R=20;
  var wOn='#639922', wOff=dark?'#3a3a3a':'#cccccc';
  var wc=isOn?wOn:wOff;
  var fillC=isOn?(dark?'#0d1f0d':'#eaf3de'):(dark?'#1c1c1c':'#f5f5f5');
  var strokeC=isOn?'#639922':(dark?'#444':'#bbb');

  // Círculo
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.fillStyle=fillC;ctx.fill();
  ctx.strokeStyle=strokeC;ctx.lineWidth=isOn?1.5:1;ctx.stroke();

  // Línea vertical de base (dentro del círculo)
  ctx.strokeStyle=wc;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx-8,cy-15);ctx.lineTo(cx-8,cy+15);ctx.stroke();

  // Línea colector: de (cx-8,cy-10) hacia arriba-derecha hasta (cx+14,cy-24)
  ctx.beginPath();ctx.moveTo(cx-8,cy-10);ctx.lineTo(cx+14,cy-24);ctx.stroke();

  // Línea emisor: de (cx-8,cy+10) hacia abajo-derecha hasta (cx+14,cy+24)
  ctx.beginPath();ctx.moveTo(cx-8,cy+10);ctx.lineTo(cx+14,cy+24);ctx.stroke();

  // Flecha emisor (NPN: flecha sale hacia afuera)
  var ex=cx+14, ey=cy+24;
  var ang=Math.atan2(14,22);
  ctx.fillStyle=wc;
  ctx.beginPath();
  ctx.moveTo(ex,ey);
  ctx.lineTo(ex-8*Math.cos(ang-0.5),ey-8*Math.sin(ang-0.5));
  ctx.lineTo(ex-8*Math.cos(ang+0.5),ey-8*Math.sin(ang+0.5));
  ctx.closePath();ctx.fill();

  // Cable base: desde el borde izquierdo del círculo hasta cx-8
  ctx.strokeStyle=wc;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx-8,cy);ctx.stroke();

  // Retorna puntos de conexión externos exactos
  return {
    b: {x:cx-R, y:cy},         // punta izquierda del cable de base
    c: {x:cx+14, y:cy-24},     // punta colector
    e: {x:cx+14, y:cy+24}      // punta emisor
  };
}

function wire(ctx,x1,y1,x2,y2,col,w){
  ctx.strokeStyle=col;ctx.lineWidth=w||1.8;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function poly(ctx,pts,col,w){
  ctx.strokeStyle=col;ctx.lineWidth=w||1.8;ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();
}
function dot(ctx,x,y,col){
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();
}
function vcc(ctx,x,y,dark){
  ctx.fillStyle=dark?'#2a2a00':'#fffbe6';
  ctx.strokeStyle=dark?'#665500':'#ccaa00';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(x-26,y-16,52,16,4);ctx.fill();ctx.stroke();
  ctx.fillStyle='#997700';ctx.font='10px sans-serif';ctx.textAlign='center';
  ctx.fillText('Vcc +5V',x,y-4);
}
function gnd(ctx,x,y,dark){
  var c=dark?'#444':'#bbb';
  ctx.strokeStyle=c;ctx.lineWidth=1.5;
  [[18,0],[12,6],[6,12]].forEach(function(r,i){
    ctx.beginPath();ctx.moveTo(x-r[0],y+r[1]);ctx.lineTo(x+r[0],y+r[1]);ctx.stroke();
  });
}
function btn(ctx,x,y,lbl,sub,bg,border,tc,dark){
  ctx.fillStyle=bg;ctx.strokeStyle=border;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.roundRect(x-24,y-20,48,40,6);ctx.fill();ctx.stroke();
  ctx.fillStyle=tc;ctx.font='bold 10px sans-serif';ctx.textAlign='center';
  ctx.fillText(lbl,x,y-5);
  ctx.font='9px sans-serif';ctx.fillText(sub,x,y+8);
}

function loop(){
  var cv=document.getElementById('cv');
  var ctx=cv.getContext('2d');
  var W=680,H=560;
  ctx.clearRect(0,0,W,H);
  frame++;

  var dark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  var tx=dark?'#666':'#999';
  var wOn='#639922', wOff=dark?'#3a3a3a':'#cccccc';
  var wFB='#e07b00', wB='#378ADD';

  // ── Topología ──
  // Puerta 1 (izq): T1 colector arriba, T2 emisor abajo, en serie
  // Puerta 2 (der): T3 colector arriba, T4 emisor abajo, en serie
  //
  // Layout:
  //   T1 centrado en (180, 180), T2 en (180, 330)
  //   T3 centrado en (500, 180), T4 en (500, 330)
  //
  // El nodo de salida de cada puerta es el punto entre
  // el emisor de T_sup y el colector de T_inf.
  //
  // Realimentación:
  //   Salida G1 (entre T1.e y T2.c) → ABAJO por x=135 → base de T3 y T4
  //   Salida G2 (entre T3.e y T4.c) → ARRIBA por x=545 → base de T1 y T2
  //   Ambos caminos van por los LADOS EXTERIORES de cada puerta,
  //   nunca cruzan por el centro.

  var T1cx=180, T1cy=180;
  var T2cx=180, T2cy=330;
  var T3cx=500, T3cy=180;
  var T4cx=500, T4cy=330;

  var t1on=(Q===1), t2on=(Q===1);
  var t3on=(Q===0), t4on=(Q===0);

  var wL=t1on?wOn:wOff;
  var wR=t3on?wOn:wOff;

  // Dibujar transistores y obtener puntos de pin
  var p1=drawNPN(ctx,T1cx,T1cy,t1on,dark);
  var p2=drawNPN(ctx,T2cx,T2cy,t2on,dark);
  var p3=drawNPN(ctx,T3cx,T3cy,t3on,dark);
  var p4=drawNPN(ctx,T4cx,T4cy,t4on,dark);

  // Etiquetas T1-T4
  ctx.fillStyle=tx;ctx.font='9px sans-serif';
  ctx.textAlign='right';ctx.fillText('T1',T1cx-24,T1cy+4);
  ctx.fillText('T2',T2cx-24,T2cy+4);
  ctx.textAlign='left';ctx.fillText('T3',T3cx+24,T3cy+4);
  ctx.fillText('T4',T4cx+24,T4cy+4);

  // Etiquetas B/C/E
  ctx.font='8px sans-serif';ctx.fillStyle=tx;
  function bce(px,isLeft){
    var sign=isLeft?1:-1;
    ctx.textAlign=isLeft?'right':'left';
  }
  // T1 T2 (izq): C y E salen a la derecha
  ctx.textAlign='left';
  ctx.fillText('C',p1.c.x+3,p1.c.y+3);
  ctx.fillText('E',p1.e.x+3,p1.e.y+3);
  ctx.fillText('C',p2.c.x+3,p2.c.y+3);
  ctx.fillText('E',p2.e.x+3,p2.e.y+3);
  ctx.textAlign='right';
  ctx.fillText('B',p1.b.x-3,p1.b.y+3);
  ctx.fillText('B',p2.b.x-3,p2.b.y+3);
  // T3 T4 (der): C y E salen a la derecha también (mismo símbolo)
  ctx.textAlign='left';
  ctx.fillText('C',p3.c.x+3,p3.c.y+3);
  ctx.fillText('E',p3.e.x+3,p3.e.y+3);
  ctx.fillText('C',p4.c.x+3,p4.c.y+3);
  ctx.fillText('E',p4.e.x+3,p4.e.y+3);
  ctx.textAlign='right';
  ctx.fillText('B',p3.b.x-3,p3.b.y+3);
  ctx.fillText('B',p4.b.x-3,p4.b.y+3);

  // ── Cajas de puerta (dashed) ──
  ctx.save();
  ctx.strokeStyle=dark?'#1a3a5a':'#b5d4f4';ctx.lineWidth=1;ctx.setLineDash([5,4]);
  ctx.beginPath();ctx.roundRect(108,100,140,290,10);ctx.stroke();
  ctx.fillStyle=dark?'rgba(55,138,221,0.05)':'rgba(55,138,221,0.04)';ctx.fill();
  ctx.setLineDash([]);
  ctx.restore();
  ctx.save();
  ctx.strokeStyle=dark?'#4a3010':'#f5c4b3';ctx.lineWidth=1;ctx.setLineDash([5,4]);
  ctx.beginPath();ctx.roundRect(432,100,140,290,10);ctx.stroke();
  ctx.fillStyle=dark?'rgba(186,117,23,0.05)':'rgba(186,117,23,0.04)';ctx.fill();
  ctx.setLineDash([]);
  ctx.restore();

  ctx.fillStyle='#378ADD';ctx.font='500 11px sans-serif';ctx.textAlign='center';
  ctx.fillText('Puerta NAND 1',178,94);
  ctx.fillStyle='#BA7517';
  ctx.fillText('Puerta NAND 2',502,94);

  // ── VCC y cables colector ──
  vcc(ctx,T1cx,42,dark);
  wire(ctx,T1cx,42,p1.c.x,p1.c.y,wL,2);
  vcc(ctx,T3cx,42,dark);
  wire(ctx,T3cx,42,p3.c.x,p3.c.y,wR,2);

  // ── Conexión en serie: emisor T1 → colector T2 ──
  // Subimos por la derecha: del emisor T1 (p1.e) al colector T2 (p2.c)
  // Usamos un camino que va por x=220 para no solapar
  var serieX_L=222, serieX_R=542;
  poly(ctx,[
    [p1.e.x,p1.e.y],
    [serieX_L,p1.e.y],
    [serieX_L,p2.c.y],
    [p2.c.x,p2.c.y]
  ],wL,2);
  poly(ctx,[
    [p3.e.x,p3.e.y],
    [serieX_R,p3.e.y],
    [serieX_R,p4.c.y],
    [p4.c.x,p4.c.y]
  ],wR,2);

  // Nodo de salida = punto medio en x=serieX, y=(p1.e.y + p2.c.y)/2
  var outL={x:serieX_L, y:(p1.e.y+p2.c.y)/2};
  var outR={x:serieX_R, y:(p3.e.y+p4.c.y)/2};
  dot(ctx,outL.x,outL.y,wL);
  dot(ctx,outR.x,outR.y,wR);

  // ── Cables emisor T2 y T4 → GND ──
  var gndY=490;
  poly(ctx,[
    [p2.e.x,p2.e.y],
    [serieX_L,p2.e.y],
    [serieX_L,gndY]
  ],wL,2);
  gnd(ctx,serieX_L,gndY,dark);
  poly(ctx,[
    [p4.e.x,p4.e.y],
    [serieX_R,p4.e.y],
    [serieX_R,gndY]
  ],wR,2);
  gnd(ctx,serieX_R,gndY,dark);

  // ── Etiquetas Q y Q̄ ──
  // Salida G1 = Q̄, sale hacia la izquierda desde outL
  // Salida G2 = Q, sale hacia la derecha desde outR
  ctx.font='bold 13px sans-serif';
  ctx.textAlign='right';
  ctx.fillStyle=Q?'#639922':'#E24B4A';
  ctx.fillText('Q\u0305='+(Q?0:1), outL.x-8, outL.y+5);
  ctx.textAlign='left';
  ctx.fillStyle=Q?'#639922':'#E24B4A';
  ctx.fillText('Q='+Q, outR.x+8, outR.y+5);

  // ── ENTRADAS de base: S̄ y R̄ ──
  // S̄ controla las bases de T1 y T2 (puerta 1)
  // Llega desde la izquierda, se divide en un nodo vertical
  var setX=58, setY=(T1cy+T2cy)/2;
  var baseLineX_L=T1cx-T1cx+T1cx-20-20; // x donde confluyen las bases = p1.b.x y p2.b.x que son iguales
  // Bases de T1 y T2 están en p1.b.x = p2.b.x = T1cx - 20
  var bLx=p1.b.x; // = T1cx - 20 = 160
  wire(ctx,setX+24,T1cy,bLx,T1cy,wB,1.8);
  wire(ctx,setX+24,T2cy,bLx,T2cy,wB,1.8);
  wire(ctx,setX+24,T1cy,setX+24,T2cy,wB,1.8);
  dot(ctx,setX+24,setY,wB);
  btn(ctx,setX,setY,'SET','S\u0305',
    dark?'#1a3a5a':'#E6F1FB','#378ADD','#185FA5',dark);

  // R̄ controla las bases de T3 y T4 (puerta 2)
  var rstX=622, rstY=(T3cy+T4cy)/2;
  var bRx=p3.b.x; // = T3cx - 20 = 480
  wire(ctx,rstX-24,T3cy,bRx,T3cy,wB,1.8);
  wire(ctx,rstX-24,T4cy,bRx,T4cy,wB,1.8);
  wire(ctx,rstX-24,T3cy,rstX-24,T4cy,wB,1.8);
  dot(ctx,rstX-24,rstY,wB);
  btn(ctx,rstX,rstY,'RST','R\u0305',
    dark?'#3a1a1a':'#FCEBEB','#E24B4A','#A32D2D',dark);

  // ══════════════════════════════════════════
  // ── REALIMENTACIÓN CRUZADA — rutas externas ──
  // ══════════════════════════════════════════
  //
  // FB1: Salida G1 (outL) → base T3 y T4
  //   Ruta: outL → baja a y=470 (por debajo de GND)
  //         → cruza horizontalmente hasta x=540
  //         → sube hasta T3cy y T4cy
  //         → entra por las bases de T3 y T4
  //
  // FB2: Salida G2 (outR) → base T1 y T2
  //   Ruta: outR → sube a y=60 (por encima de VCC)
  //         → cruza horizontalmente hasta x=140
  //         → baja hasta T1cy y T2cy
  //         → entra por las bases de T1 y T2

  var fbTopY=60;   // carril superior (sobre VCC)
  var fbBotY=475;  // carril inferior (bajo GND)
  var fbLx=135;    // carril vertical izquierdo (fuera de la caja)
  var fbRx=545;    // carril vertical derecho (fuera de la caja)

  // FB2: G2 (outR) → arriba → izquierda → bases T1 y T2
  poly(ctx,[
    [outR.x, outR.y],
    [fbRx, outR.y],
    [fbRx, fbTopY],
    [fbLx, fbTopY],
    [fbLx, T1cy],
    [bLx,  T1cy]
  ], wFB, 2);
  wire(ctx, fbLx, T1cy, fbLx, T2cy, wFB, 2);
  wire(ctx, fbLx, T2cy, bLx, T2cy, wFB, 2);
  dot(ctx, fbLx, T1cy, wFB);
  dot(ctx, fbLx, T2cy, wFB);
  dot(ctx, outR.x, outR.y, wFB);

  // Flechas dirección FB2 (pequeñas en el recorrido)
  ctx.fillStyle=wFB;
  // flecha arriba en fbRx
  ctx.beginPath();ctx.moveTo(fbRx,fbTopY+20);ctx.lineTo(fbRx-5,fbTopY+32);ctx.lineTo(fbRx+5,fbTopY+32);ctx.closePath();ctx.fill();
  // flecha izquierda en fbTopY
  ctx.beginPath();ctx.moveTo(fbLx+30,fbTopY);ctx.lineTo(fbLx+42,fbTopY-5);ctx.lineTo(fbLx+42,fbTopY+5);ctx.closePath();ctx.fill();

  // FB1: G1 (outL) → abajo → derecha → bases T3 y T4
  poly(ctx,[
    [outL.x, outL.y],
    [fbLx, outL.y],
    [fbLx, fbBotY],
    [fbRx, fbBotY],
    [fbRx, T4cy],
    [bRx,  T4cy]
  ], wFB, 2);
  wire(ctx, fbRx, T4cy, fbRx, T3cy, wFB, 2);
  wire(ctx, fbRx, T3cy, bRx, T3cy, wFB, 2);
  dot(ctx, fbRx, T4cy, wFB);
  dot(ctx, fbRx, T3cy, wFB);
  dot(ctx, outL.x, outL.y, wFB);

  // Flechas dirección FB1
  ctx.fillStyle=wFB;
  // flecha abajo en fbLx
  ctx.beginPath();ctx.moveTo(fbLx,fbBotY-20);ctx.lineTo(fbLx-5,fbBotY-32);ctx.lineTo(fbLx+5,fbBotY-32);ctx.closePath();ctx.fill();
  // flecha derecha en fbBotY
  ctx.beginPath();ctx.moveTo(fbRx-30,fbBotY);ctx.lineTo(fbRx-42,fbBotY-5);ctx.lineTo(fbRx-42,fbBotY+5);ctx.closePath();ctx.fill();

  // Etiquetas realimentación
  ctx.fillStyle=wFB;ctx.font='9px sans-serif';ctx.textAlign='center';
  ctx.fillText('Realimentación: Q \u2192 base T1,T2',(fbLx+fbRx)/2,fbTopY-8);
  ctx.fillText('Realimentación: Q\u0305 \u2192 base T3,T4',(fbLx+fbRx)/2,fbBotY+12);

  // ── Partículas animadas ──
  if(frame%6===0){
    if(Q) particles.push({x:T3cx,y:42,gy:p3.c.y,prog:0,col:wOn});
    else  particles.push({x:T1cx,y:42,gy:p1.c.y,prog:0,col:wOn});
  }
  particles=particles.filter(function(p){
    p.prog+=0.05;if(p.prog>=1)return false;
    var py=p.y+(p.gy-p.y)*p.prog;
    ctx.beginPath();ctx.arc(p.x,py,3.5,0,Math.PI*2);
    ctx.fillStyle=p.col;ctx.fill();
    return true;
  });

  requestAnimationFrame(loop);
}
loop();
</script>
