<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIGEN-CIBERSEGURIDAD.</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080f;
  --panel: #0d1117;
  --panel2: #111827;
  --border: #1e2d40;
  --b2: #253347;
  --p1: #3b82f6;
  --p2: #f59e0b;
  --p3: #10b981;
  --p4: #ef4444;
  --text: #e2e8f0;
  --text2: #7090b0;
  --text3: #2a4060;
  --white: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 3px);
}
canvas#bgCanvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  opacity: 0.4;
}
.page {
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}
header {
  text-align: center;
  margin-bottom: 28px;
}
.htag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--p1);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 10px;
}
h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(22px, 5vw, 36px);
  font-weight: 800;
  color: var(--white);
  line-height: 1.15;
  margin-bottom: 8px;
}
h1 span { color: var(--p2); }
.hsub {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
}

/* SCORE BAR */
.score-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 20px;
  margin-bottom: 24px;
  gap: 12px;
  flex-wrap: wrap;
}
.score-item {
  text-align: center;
}
.score-label {
  font-size: 10px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 4px;
}
.score-value {
  font-family: 'Syne', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--p2);
}
.score-value.green { color: var(--p3); }
.score-value.blue { color: var(--p1); }

/* PROGRESS BAR */
.progress-wrap {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 20px;
  margin-bottom: 24px;
}
.progress-label {
  font-size: 11px;
  color: var(--text2);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
}
.progress-track {
  height: 6px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--p1), var(--p2));
  border-radius: 4px;
  transition: width 0.5s ease;
}

/* QUESTION CARD */
.question-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 28px 24px;
  margin-bottom: 20px;
}
.q-number {
  font-size: 11px;
  color: var(--p1);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.q-text {
  font-family: 'Syne', sans-serif;
  font-size: clamp(16px, 3vw, 20px);
  font-weight: 700;
  color: var(--white);
  line-height: 1.4;
  margin-bottom: 6px;
}
.q-context {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.6;
  margin-top: 8px;
}

/* OPTIONS */
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
@media (max-width: 560px) { .options-grid { grid-template-columns: 1fr; } }

.opt-btn {
  background: var(--panel2);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  line-height: 1.5;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.opt-btn:hover:not(:disabled) {
  border-color: var(--p1);
  background: rgba(59,130,246,0.08);
  transform: translateY(-2px);
}
.opt-btn .opt-letter {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 16px;
  color: var(--p1);
  min-width: 22px;
  margin-top: 1px;
}
.opt-btn.correct {
  border-color: var(--p3);
  background: rgba(16,185,129,0.12);
  color: var(--white);
}
.opt-btn.correct .opt-letter { color: var(--p3); }
.opt-btn.wrong {
  border-color: var(--p4);
  background: rgba(239,68,68,0.12);
}
.opt-btn.wrong .opt-letter { color: var(--p4); }
.opt-btn:disabled { cursor: default; transform: none; }

/* FEEDBACK */
.feedback-box {
  border-radius: 10px;
  padding: 16px 20px;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 20px;
  display: none;
}
.feedback-box.show { display: block; }
.feedback-box.ok {
  background: rgba(16,185,129,0.1);
  border: 1px solid var(--p3);
  color: var(--p3);
}
.feedback-box.fail {
  background: rgba(239,68,68,0.1);
  border: 1px solid var(--p4);
  color: #fca5a5;
}
.feedback-icon { font-size: 20px; margin-bottom: 6px; }

/* BUTTONS */
.btn-next {
  background: linear-gradient(135deg, var(--p1), #1d4ed8);
  border: none;
  border-radius: 10px;
  padding: 16px 32px;
  color: var(--white);
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  width: 100%;
  transition: all 0.2s;
  display: none;
  letter-spacing: 1px;
}
.btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(59,130,246,0.3); }
.btn-next.show { display: block; }

/* RESULTS */
.results-card {
  display: none;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px 28px;
  text-align: center;
}
.results-card.show { display: block; }
.results-emoji { font-size: 56px; margin-bottom: 16px; }
.results-title {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 800;
  color: var(--white);
  margin-bottom: 8px;
}
.results-subtitle {
  font-size: 14px;
  color: var(--text2);
  margin-bottom: 28px;
  line-height: 1.6;
}
.results-stats {
  display: flex;
  justify-content: center;
  gap: 28px;
  flex-wrap: wrap;
  margin-bottom: 32px;
}
.stat-box {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 24px;
  min-width: 110px;
}
.stat-val {
  font-family: 'Syne', sans-serif;
  font-size: 30px;
  font-weight: 800;
  color: var(--p2);
}
.stat-lbl { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
.btn-restart {
  background: var(--panel2);
  border: 2px solid var(--p2);
  border-radius: 10px;
  padding: 14px 32px;
  color: var(--p2);
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
}
.btn-restart:hover { background: var(--p2); color: var(--bg); }
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="page">
  <header>
    <div class="htag">// SEGURIDAD INFORMÁTICA · TEORÍA 7.1</div>
    <h1>El <span>Origen</span> de la Ciberseguridad</h1>
    <p class="hsub">Descubre la historia del primer virus, las capas de Internet y los fundamentos de la seguridad digital</p>
  </header>

  <div class="score-bar">
    <div class="score-item">
      <div class="score-label">Puntos</div>
      <div class="score-value" id="scoreDisplay">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">Aciertos</div>
      <div class="score-value green" id="correctDisplay">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">Fallos</div>
      <div class="score-value" style="color:var(--p4)" id="wrongDisplay">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">Pregunta</div>
      <div class="score-value blue" id="qNumDisplay">1/8</div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>Progreso</span>
      <span id="pctLabel">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div id="gameArea">
    <div class="question-card" id="questionCard">
      <div class="q-number" id="qNumber">PREGUNTA 1 DE 8</div>
      <div class="q-text" id="qText"></div>
      <div class="q-context" id="qContext"></div>
    </div>

    <div class="options-grid" id="optionsGrid"></div>

    <div class="feedback-box" id="feedbackBox">
      <div class="feedback-icon" id="feedbackIcon"></div>
      <div id="feedbackText"></div>
    </div>

    <button class="btn-next" id="btnNext" onclick="nextQuestion()">SIGUIENTE PREGUNTA →</button>
  </div>

  <div class="results-card" id="resultsCard">
    <div class="results-emoji" id="resEmoji"></div>
    <div class="results-title" id="resTitle"></div>
    <div class="results-subtitle" id="resSub"></div>
    <div class="results-stats">
      <div class="stat-box">
        <div class="stat-val" id="resScore"></div>
        <div class="stat-lbl">Puntos</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="resCorrect"></div>
        <div class="stat-lbl">Aciertos</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="resPct"></div>
        <div class="stat-lbl">Del máximo</div>
      </div>
    </div>
    <button class="btn-restart" onclick="restartGame()">↩ REINICIAR JUEGO</button>
  </div>
</div>

<script>
// ── CANVAS BACKGROUND ──────────────────────────────────────────────────────
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

function resizeCanvas() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.4;
    this.r = Math.random() * 2 + 0.5;
    this.alpha = Math.random() * 0.6 + 0.1;
    this.color = Math.random() > 0.5 ? '#3b82f6' : '#f59e0b';
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = this.alpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

for (let i = 0; i < 80; i++) particles.push(new Particle());

function animBg() {
  ctx.clearRect(0, 0, W, H);
  // Draw connections
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 120) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = '#1e2d40';
        ctx.globalAlpha = (1 - dist / 120) * 0.5;
        ctx.lineWidth = 0.5;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
    particles[i].update();
    particles[i].draw();
  }
  requestAnimationFrame(animBg);
}
animBg();

// ── QUIZ DATA ──────────────────────────────────────────────────────────────
const QUESTIONS = [
  {
    text: '¿Cuál fue el primer programa considerado "virus" de la historia informática?',
    context: 'Ocurrió en 1971, en la red ARPANET, precursora de Internet.',
    opts: ['Reaper', 'Creeper', 'WannaCry', 'MyDoom'],
    correct: 1,
    feedback: '✅ ¡Correcto! Creeper (1971) fue el primer virus de la historia. No era malicioso: saltaba entre ordenadores mostrando el mensaje "I\'m the creeper, catch me if you can!"'
  },
  {
    text: '¿Qué mensaje mostraba el virus Creeper mientras saltaba entre ordenadores?',
    context: 'Este mensaje apareció en los primeros ordenadores conectados en red.',
    opts: ['"You have been hacked!"', '"Error 404: Security not found"', '"I\'m the creeper, catch me if you can!"', '"System compromised"'],
    correct: 2,
    feedback: '✅ ¡Exacto! El mensaje "I\'m the creeper, catch me if you can!" apareció en pantalla mientras el programa saltaba entre máquinas de ARPANET.'
  },
  {
    text: '¿Qué fue Reaper y quién lo creó?',
    context: 'Fue la respuesta directa al problema que planteaba Creeper.',
    opts: ['Un virus más peligroso, creado por hackers rusos', 'El primer antivirus de la historia, creado por Ray Tomlinson', 'Un cortafuegos, creado por la NASA', 'Un sistema operativo seguro'],
    correct: 1,
    feedback: '✅ ¡Muy bien! Reaper fue creado por Ray Tomlinson para buscar, "infectar" y eliminar a Creeper. Se convirtió en el primer programa antivirus de la historia tecnológica.'
  },
  {
    text: '¿Qué porcentaje aproximado de Internet es la "Surface Web", la parte visible que indexan Google o Bing?',
    context: 'La mayor parte de Internet está "bajo el agua", como un iceberg.',
    opts: ['Casi el 90%', 'Aproximadamente el 50%', 'Solo el 10%', 'El 25%'],
    correct: 2,
    feedback: '✅ ¡Correcto! La Surface Web representa solo el 10% de Internet: son los sitios públicos que aparecen en los buscadores. El 90% restante es la Deep Web.'
  },
  {
    text: '¿Qué es la Deep Web?',
    context: 'No hay que confundirla con la Dark Web, que es diferente.',
    opts: ['Páginas ilegales accesibles con el navegador Tor', 'Páginas no públicas que requieren contraseña o pago (email, banca online, registros médicos)', 'Webs muy antiguas de los años 90', 'Contenido para adultos'],
    correct: 1,
    feedback: '✅ ¡Perfecto! La Deep Web (90% de Internet) incluye todo lo que no está indexado: tu correo, tu banco online, historias clínicas, repositorios privados. Es privada, no ilegal.'
  },
  {
    text: '¿Cómo se accede a la Dark Web, la parte intencionalmente oculta de Internet?',
    context: 'Representa apenas el 0,1% de Internet.',
    opts: ['Con cualquier navegador normal', 'Con una conexión Wi-Fi pública', 'Con navegadores especiales como Tor o I2P', 'Escribiendo "dark:" antes de la URL'],
    correct: 2,
    feedback: '✅ ¡Correcto! La Dark Web (0,1% de Internet) solo es accesible con navegadores anónimos como Tor o I2P. Aloja desde información legítima hasta mercados ilegales.'
  },
  {
    text: '¿Cuál de estos contenidos pertenece a la Deep Web y NO a la Dark Web?',
    context: 'La Deep Web es enorme y la usamos todos los días sin saberlo.',
    opts: ['Mercados ilegales financiados con criptomonedas', 'Tu bandeja de entrada del correo electrónico', 'Páginas de venta de datos robados', 'Foros de hackers anónimos'],
    correct: 1,
    feedback: '✅ ¡Exacto! Tu correo electrónico está en la Deep Web: necesita contraseña para acceder y los buscadores no pueden indexarlo. La usamos cada día de forma segura y legal.'
  },
  {
    text: '¿Cuál es el objetivo principal de la ciberseguridad?',
    context: 'La historia de Creeper y Reaper marca el inicio de esta disciplina.',
    opts: ['Crear virus más potentes para investigación', 'Proteger sistemas, redes y datos frente a ataques digitales', 'Acelerar la velocidad de Internet', 'Controlar quién puede usar el ordenador'],
    correct: 1,
    feedback: '✅ ¡Muy bien! La ciberseguridad nació con Reaper: proteger sistemas, redes y datos de accesos no autorizados, ataques y daños. Desde 1971 hasta hoy, ese objetivo no ha cambiado.'
  }
];

// ── GAME STATE ─────────────────────────────────────────────────────────────
let score = 0, correct = 0, wrong = 0, qIndex = 0;
let answered = false;
const MAX = QUESTIONS.length * 100;

function renderQuestion() {
  const q = QUESTIONS[qIndex];
  answered = false;

  document.getElementById('qNumber').textContent = `PREGUNTA ${qIndex + 1} DE ${QUESTIONS.length}`;
  document.getElementById('qText').textContent = q.text;
  document.getElementById('qContext').textContent = q.context;
  document.getElementById('qNumDisplay').textContent = `${qIndex + 1}/${QUESTIONS.length}`;

  const pct = Math.round((qIndex / QUESTIONS.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('pctLabel').textContent = pct + '%';

  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
    btn.onclick = () => selectAnswer(i);
    grid.appendChild(btn);
  });

  document.getElementById('feedbackBox').className = 'feedback-box';
  document.getElementById('btnNext').className = 'btn-next';
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[qIndex];
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b => b.disabled = true);

  const isCorrect = idx === q.correct;
  btns[idx].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) btns[q.correct].classList.add('correct');

  const fb = document.getElementById('feedbackBox');
  const fi = document.getElementById('feedbackIcon');
  const ft = document.getElementById('feedbackText');

  if (isCorrect) {
    score += (wrong === 0 ? 100 : 50);
    correct++;
    fb.className = 'feedback-box ok show';
    fi.textContent = '🎯';
    ft.textContent = q.feedback;
  } else {
    score = Math.max(0, score - 10);
    wrong++;
    fb.className = 'feedback-box fail show';
    fi.textContent = '💡';
    ft.textContent = 'No es esa. ' + q.feedback.replace('✅ ¡Correcto! ', '').replace('✅ ¡Exacto! ', '').replace('✅ ¡Muy bien! ', '').replace('✅ ¡Perfecto! ', '');
  }

  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('correctDisplay').textContent = correct;
  document.getElementById('wrongDisplay').textContent = wrong;

  document.getElementById('btnNext').className = 'btn-next show';
}

function nextQuestion() {
  qIndex++;
  if (qIndex >= QUESTIONS.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('gameArea').style.display = 'none';
  const rc = document.getElementById('resultsCard');
  rc.className = 'results-card show';

  const pct = Math.round((score / MAX) * 100);
  document.getElementById('resScore').textContent = score;
  document.getElementById('resCorrect').textContent = `${correct}/${QUESTIONS.length}`;
  document.getElementById('resPct').textContent = pct + '%';

  let emoji, title, sub;
  if (pct >= 85) {
    emoji = '🔐'; title = '¡Experto en Ciberseguridad!';
    sub = 'Dominas el origen de la seguridad digital. Desde Creeper hasta la Dark Web, nada se te escapa.';
  } else if (pct >= 65) {
    emoji = '🛡️'; title = 'Bien Protegido';
    sub = 'Tienes una buena base sobre el origen de la ciberseguridad. ¡Sigue aprendiendo!';
  } else if (pct >= 45) {
    emoji = '🔍'; title = 'Buen Intento';
    sub = 'Hay conceptos que repasar. Revisa la historia de Creeper y las capas de Internet.';
  } else {
    emoji = '💻'; title = '¡Ánimo, puedes lograrlo!';
    sub = 'La ciberseguridad tiene mucha historia. Repasa el tema y vuelve a intentarlo.';
  }

  document.getElementById('resEmoji').textContent = emoji;
  document.getElementById('resTitle').textContent = title;
  document.getElementById('resSub').textContent = sub;

  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('pctLabel').textContent = '100%';
}

function restartGame() {
  score = 0; correct = 0; wrong = 0; qIndex = 0;
  document.getElementById('scoreDisplay').textContent = 0;
  document.getElementById('correctDisplay').textContent = 0;
  document.getElementById('wrongDisplay').textContent = 0;
  document.getElementById('resultsCard').className = 'results-card';
  document.getElementById('gameArea').style.display = 'block';
  renderQuestion();
}

renderQuestion();
</script>
</body>
</html>
