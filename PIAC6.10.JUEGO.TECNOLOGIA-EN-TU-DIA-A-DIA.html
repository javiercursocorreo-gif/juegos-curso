<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego 7 — Tecnología en tu día a día</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f0f4ff;
  --card:#ffffff;
  --primary:#4f46e5;
  --primary2:#6366f1;
  --accent:#f59e0b;
  --accent2:#fbbf24;
  --green:#10b981;
  --green2:#34d399;
  --red:#ef4444;
  --red2:#fca5a5;
  --blue:#3b82f6;
  --purple:#8b5cf6;
  --pink:#ec4899;
  --orange:#f97316;
  --teal:#14b8a6;
  --text:#1e1b4b;
  --text2:#4338ca;
  --dim:#6b7280;
  --shadow:0 4px 24px rgba(79,70,229,0.10);
  --shadow2:0 8px 32px rgba(79,70,229,0.18);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg);
  font-family:'Nunito',sans-serif;
  color:var(--text);
  min-height:100vh;
  background-image: radial-gradient(circle at 20% 20%, rgba(99,102,241,0.08) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(245,158,11,0.08) 0%, transparent 50%);
}
.page { max-width:760px; margin:0 auto; padding:20px 16px 60px; }

/* HEADER */
header {
  text-align:center;
  padding:24px 20px 20px;
  margin-bottom:20px;
}
.header-tag {
  font-size:11px; letter-spacing:4px; color:var(--primary2);
  text-transform:uppercase; margin-bottom:10px; font-weight:700;
}
h1 {
  font-family:'Fredoka One',sans-serif;
  font-size:clamp(24px,5vw,40px);
  color:var(--primary);
  margin-bottom:6px;
  line-height:1.1;
}
.header-sub { font-size:14px; color:var(--dim); font-weight:600; }

/* SCORE BAR */
.score-bar {
  display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
  margin-bottom:22px;
}
.score-chip {
  background:var(--card);
  border-radius:50px;
  padding:10px 20px;
  box-shadow:var(--shadow);
  display:flex; align-items:center; gap:8px;
  font-weight:800; font-size:15px;
}
.score-chip .icon { font-size:18px; }
.score-chip .val { color:var(--primary); }
.score-chip .lbl { color:var(--dim); font-size:12px; font-weight:600; }

/* PROGRESS */
.progress-wrap { margin-bottom:22px; }
.progress-top { display:flex; justify-content:space-between; font-size:13px; font-weight:700; color:var(--dim); margin-bottom:6px; }
.progress-bar { height:8px; background:#e0e7ff; border-radius:99px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--primary),var(--purple)); border-radius:99px; transition:width 0.5s ease; }

/* SCENARIO CARD */
.scenario-card {
  background:var(--card);
  border-radius:24px;
  box-shadow:var(--shadow2);
  padding:28px 28px 24px;
  margin-bottom:18px;
  position:relative;
  overflow:hidden;
}
.scenario-card::before {
  content:'';
  position:absolute; top:0; left:0; right:0; height:5px;
  background:linear-gradient(90deg,var(--primary),var(--purple),var(--pink));
}
.scenario-num {
  font-size:11px; letter-spacing:3px; font-weight:800;
  color:var(--primary2); text-transform:uppercase; margin-bottom:12px;
}
.scenario-emoji {
  font-size:clamp(48px,10vw,72px);
  display:block; text-align:center;
  margin-bottom:14px;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.12));
}
.scenario-title {
  font-family:'Fredoka One',sans-serif;
  font-size:clamp(17px,3.5vw,24px);
  text-align:center; color:var(--text);
  margin-bottom:10px; line-height:1.2;
}
.scenario-desc {
  font-size:14px; color:var(--dim); text-align:center;
  line-height:1.6; max-width:520px; margin:0 auto 18px;
  font-weight:600;
}
.scenario-badge {
  display:inline-flex; align-items:center; gap:6px;
  background:var(--bg); border-radius:50px;
  padding:5px 14px; font-size:12px; font-weight:800;
  color:var(--primary2); margin:0 auto 0; display:block;
  text-align:center; width:fit-content; margin:0 auto;
}

/* QUESTION BLOCK */
.question-block {
  background:var(--card);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:22px 24px;
  margin-bottom:14px;
  border:2px solid #e0e7ff;
  transition:border-color 0.2s;
}
.question-block.answered { border-color:#c7d2fe; }
.question-text {
  font-size:clamp(14px,2.5vw,17px);
  font-weight:800; color:var(--text);
  margin-bottom:16px; line-height:1.4;
}
.question-number {
  display:inline-block;
  background:var(--primary); color:#fff;
  border-radius:50%; width:24px; height:24px;
  text-align:center; line-height:24px;
  font-size:12px; font-weight:900;
  margin-right:8px; flex-shrink:0;
}

/* OPTIONS */
.options { display:flex; flex-direction:column; gap:10px; }
.options.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.opt-btn {
  background:var(--bg);
  border:2.5px solid #e0e7ff;
  border-radius:14px;
  padding:12px 16px;
  cursor:pointer;
  font-family:'Nunito',sans-serif;
  font-size:14px; font-weight:700;
  color:var(--text);
  text-align:left;
  transition:all 0.18s;
  display:flex; align-items:center; gap:10px;
}
.opt-btn:hover:not(:disabled) {
  border-color:var(--primary2);
  background:#eef2ff;
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(99,102,241,0.15);
}
.opt-btn:disabled { cursor:default; }
.opt-btn.correct {
  background:#d1fae5; border-color:var(--green);
  color:#065f46;
}
.opt-btn.wrong {
  background:#fee2e2; border-color:var(--red);
  color:#991b1b;
  text-decoration:line-through; opacity:0.7;
}
.opt-btn.revealed {
  background:#d1fae5; border-color:var(--green);
  color:#065f46;
}
.opt-icon { font-size:20px; flex-shrink:0; }
.opt-text { flex:1; line-height:1.3; }

/* FEEDBACK */
.feedback {
  border-radius:14px;
  padding:14px 18px;
  margin-top:12px;
  font-size:14px; font-weight:700;
  line-height:1.5;
  display:none;
  animation:fadeIn 0.3s ease;
}
.feedback.show { display:block; }
.feedback.ok { background:#d1fae5; color:#065f46; border:2px solid #6ee7b7; }
.feedback.fail { background:#fef3c7; color:#92400e; border:2px solid #fcd34d; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

/* POINTS POPUP */
.pts-popup {
  position:fixed;
  font-family:'Fredoka One',sans-serif;
  font-size:28px;
  font-weight:900;
  pointer-events:none;
  z-index:999;
  animation:popUp 1.2s ease forwards;
}
@keyframes popUp {
  0%   { opacity:1; transform:translateY(0) scale(1); }
  60%  { opacity:1; transform:translateY(-50px) scale(1.2); }
  100% { opacity:0; transform:translateY(-90px) scale(0.9); }
}

/* NEXT BTN */
.next-wrap { text-align:center; margin-top:18px; }
.next-btn {
  background:linear-gradient(135deg,var(--primary),var(--purple));
  color:#fff;
  border:none; border-radius:50px;
  padding:14px 36px;
  font-family:'Fredoka One',sans-serif;
  font-size:18px; letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(79,70,229,0.35);
  transition:all 0.2s;
  display:none;
}
.next-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(79,70,229,0.4); }
.next-btn.show { display:inline-block; }

/* RESULTS */
.results-card {
  background:var(--card);
  border-radius:24px;
  box-shadow:var(--shadow2);
  padding:36px 28px;
  text-align:center;
  display:none;
}
.results-card.show { display:block; animation:fadeIn 0.5s ease; }
.results-emoji { font-size:72px; display:block; margin-bottom:16px; }
.results-title {
  font-family:'Fredoka One',sans-serif;
  font-size:clamp(22px,5vw,36px);
  color:var(--primary); margin-bottom:8px;
}
.results-score {
  font-family:'Fredoka One',sans-serif;
  font-size:clamp(40px,8vw,64px);
  color:var(--accent); margin-bottom:6px;
}
.results-sub { font-size:15px; color:var(--dim); font-weight:700; margin-bottom:24px; }
.results-stats {
  display:flex; gap:16px; justify-content:center; flex-wrap:wrap;
  margin-bottom:28px;
}
.rstat {
  background:var(--bg); border-radius:16px;
  padding:14px 20px; min-width:110px;
}
.rstat-val { font-family:'Fredoka One',sans-serif; font-size:28px; color:var(--primary); }
.rstat-lbl { font-size:12px; color:var(--dim); font-weight:700; margin-top:2px; }
.restart-btn {
  background:linear-gradient(135deg,var(--accent),var(--orange));
  color:#fff; border:none; border-radius:50px;
  padding:14px 36px;
  font-family:'Fredoka One',sans-serif; font-size:18px;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(245,158,11,0.35);
  transition:all 0.2s;
}
.restart-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(245,158,11,0.4); }

/* MEDAL */
.medal { font-size:28px; margin-left:8px; }
</style>
</head>
<body>
<div class="page">

<header>
  <div class="header-tag">// Telecomunicaciones · Teoría 6</div>
  <h1>📱 Tecnología en tu día a día</h1>
  <p class="header-sub">¿Qué red usa cada situación? ¿Gasta datos?</p>

  <div class="score-chip"><span class="icon">❌</span><span class="val" id="wrongVal">0</span><span class="lbl">fallos</span></div>
</div>

<div class="progress-wrap">
  <div class="progress-top">
    <span id="progLabel">Escenario 1 de 12</span>
    <span id="progPct">0%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
</div>

<div id="scenarioArea"></div>

<div class="next-wrap">
  <button class="next-btn" id="nextBtn" onclick="nextScenario()">Siguiente situación →</button>
</div>

<div class="results-card" id="resultsCard"></div>

</div>

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let scenarioIdx = 0;
let questionIdx = 0;
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let firstTryCount = 0; // questions answered correctly on first try
let currentScenarioComplete = false;
let questionAnswered = false;

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
function render() {
  if (scenarioIdx >= SCENARIOS.length) {
    showResults();
    return;
  }

  const sc = SCENARIOS[scenarioIdx];
  updateProgress();

  const area = document.getElementById('scenarioArea');
  area.innerHTML = `
    <div class="scenario-card">
      <div class="scenario-num">SITUACIÓN ${scenarioIdx+1} DE ${SCENARIOS.length}</div>
      <span class="scenario-emoji">${sc.emoji}</span>
      <div class="scenario-title">${sc.title}</div>
      <div class="scenario-desc">${sc.desc}</div>
      <div class="scenario-badge">${sc.badge}</div>
    </div>
    <div id="questionsArea"></div>
  `;

  questionIdx = 0;
  currentScenarioComplete = false;
  renderQuestion();
}

function renderQuestion() {
  const sc = SCENARIOS[scenarioIdx];
  const q  = sc.questions[questionIdx];
  const isGrid2 = q.options.length === 2;
  const area = document.getElementById('questionsArea');

  const div = document.createElement('div');
  div.className = 'question-block';
  div.id = `q_${questionIdx}`;

  const opts = q.options.map((opt,i) => `
    <button class="opt-btn" id="opt_${questionIdx}_${i}" onclick="answerQ(${i})">
      <span class="opt-icon">${opt.icon}</span>
      <span class="opt-text">${opt.text}</span>
    </button>
  `).join('');

  div.innerHTML = `
    <div class="question-text">
      <span class="question-number">${questionIdx+1}</span>${q.text}
    </div>
    <div class="options ${isGrid2?'grid2':''}" id="opts_${questionIdx}">${opts}</div>
    <div class="feedback" id="fb_${questionIdx}"></div>
  `;

  area.appendChild(div);
  questionAnswered = false;
}

function answerQ(optIdx) {
  if (questionAnswered) return;
  questionAnswered = true;

  const sc = SCENARIOS[scenarioIdx];
  const q  = sc.questions[questionIdx];
  const opt = q.options[optIdx];
  const isFirstTry = !document.getElementById(`opt_${questionIdx}_0`).classList.contains('was-tried');

  if (opt.correct) {
    // Correct answer
    document.getElementById(`opt_${questionIdx}_${optIdx}`).classList.add('correct');
    disableOptions(questionIdx);

    const pts = isFirstTry ? 100 : 50;
    score += pts;
    correctCount++;
    if (isFirstTry) firstTryCount++;

    updateScore();
    showFeedback(questionIdx, true, q.feedback_ok);
    showPtsPopup(`+${pts}`, '#10b981');

    // Move to next question or finish scenario
    setTimeout(() => {
      questionIdx++;
      if (questionIdx < sc.questions.length) {
        renderQuestion();
        questionAnswered = false;
      } else {
        // Scenario complete
        currentScenarioComplete = true;
        document.getElementById('nextBtn').classList.add('show');
      }
    }, 1400);

  } else {
    // Wrong answer
    questionAnswered = false; // allow retry
    document.getElementById(`opt_${questionIdx}_${optIdx}`).classList.add('wrong');
    document.getElementById(`opt_${questionIdx}_${optIdx}`).disabled = true;
    // Mark as tried
    document.getElementById(`opt_${questionIdx}_0`).classList.add('was-tried');

    score = Math.max(0, score - 10);
    wrongCount++;
    updateScore();
    showFeedback(questionIdx, false, q.feedback_fail);
    showPtsPopup('-10', '#ef4444');

    // Hide feedback after a moment, let them try again
    setTimeout(() => {
      const fb = document.getElementById(`fb_${questionIdx}`);
      if (fb) { fb.classList.remove('show'); }
    }, 2200);
  }
}

function disableOptions(qIdx) {
  const opts = document.querySelectorAll(`[id^="opt_${qIdx}_"]`);
  opts.forEach(o => o.disabled = true);
}

function showFeedback(qIdx, ok, msg) {
  const fb = document.getElementById(`fb_${qIdx}`);
  if (!fb) return;
  fb.className = `feedback ${ok?'ok':'fail'} show`;
  fb.textContent = msg;
}

function showPtsPopup(text, color) {
  const popup = document.createElement('div');
  popup.className = 'pts-popup';
  popup.textContent = text;
  popup.style.color = color;
  // Position near score bar
  const bar = document.querySelector('.score-bar');
  const rect = bar.getBoundingClientRect();
  popup.style.top = (rect.top + window.scrollY - 10) + 'px';
  popup.style.left = (rect.left + rect.width/2 - 30) + 'px';
  document.body.appendChild(popup);
  setTimeout(() => popup.remove(), 1300);
}

function updateScore() {
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('correctVal').textContent = correctCount;
  document.getElementById('wrongVal').textContent = wrongCount;
}

function updateProgress() {
  const pct = Math.round((scenarioIdx / SCENARIOS.length) * 100);
  document.getElementById('progLabel').textContent = `Situación ${scenarioIdx+1} de ${SCENARIOS.length}`;
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('progFill').style.width = pct + '%';
}

function nextScenario() {
  scenarioIdx++;
  document.getElementById('nextBtn').classList.remove('show');
  if (scenarioIdx >= SCENARIOS.length) {
    showResults();
  } else {
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

// ═══════════════════════════════════════════════════════════
// RESULTS
// ═══════════════════════════════════════════════════════════
function showResults() {
  document.getElementById('scenarioArea').innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('progFill').style.width = '100%';
  document.getElementById('progPct').textContent = '100%';
  document.getElementById('progLabel').textContent = `¡Completado!`;

  const totalQuestions = SCENARIOS.reduce((s,sc)=>s+sc.questions.length,0);
  const pct = Math.round((firstTryCount / totalQuestions)*100);

  let emoji, title, msg;
  if (pct >= 90) { emoji='🏆'; title='¡Experto en tecnología!'; msg='Dominas perfectamente qué red usa cada dispositivo. ¡Sobresaliente!'; }
  else if (pct >= 70) { emoji='🥇'; title='¡Muy buen resultado!'; msg='Tienes una sólida comprensión de las redes y el consumo de datos. ¡Muy bien!'; }
  else if (pct >= 50) { emoji='🥈'; title='¡Buen trabajo!'; msg='Has aprendido bastante. Repasa los escenarios donde tuviste dudas.'; }
  else { emoji='📚'; title='¡Sigue practicando!'; msg='Hoy has aprendido muchas cosas nuevas. Vuelve a intentarlo para afianzarlos.'; }

  const medal = pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'🥉';

  const rc = document.getElementById('resultsCard');
  rc.innerHTML = `
    <span class="results-emoji">${emoji}</span>
    <div class="results-title">${title}</div>
    <div class="results-score">${score} pts</div>
    <div class="results-sub">${msg}</div>
    <div class="results-stats">
      <div class="rstat"><div class="rstat-val">${correctCount}</div><div class="rstat-lbl">✅ Respuestas correctas</div></div>
      <div class="rstat"><div class="rstat-val">${wrongCount}</div><div class="rstat-lbl">❌ Intentos fallidos</div></div>
      <div class="rstat"><div class="rstat-val">${pct}%</div><div class="rstat-lbl">⭐ A la primera</div></div>
    </div>
    <button class="restart-btn" onclick="restartGame()">🔄 Jugar de nuevo</button>
  `;
  rc.classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
}

function restartGame() {
  scenarioIdx = 0; questionIdx = 0;
  score = 0; correctCount = 0; wrongCount = 0; firstTryCount = 0;
  updateScore();
  document.getElementById('resultsCard').classList.remove('show');
  document.getElementById('nextBtn').style.display = '';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── INIT ──
render();
</script>
